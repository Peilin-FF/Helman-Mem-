# Multi-GPU full-parameter SFT (verl.trainer.fsdp_sft_trainer, torchrun) for distillation data:
# hinted own-words solutions chosen by the memory, self-distilled solutions, etc.
data:
  train_batch_size: 64
  micro_batch_size: null
  micro_batch_size_per_gpu: 2
  train_files: outputs/rl/data/q3_4b/sft_hinted_memory.parquet
  val_files: outputs/rl/data/q3_4b/sft_hinted_memory.parquet
  prompt_key: prompt          # chat messages (rendered without the thinking block) or a rendered string
  response_key: response
  prompt_dict_keys: null
  response_dict_keys: null
  multiturn:
    enable: false
    messages_key: messages
  max_length: 4096
  truncation: right
  balance_dp_token: False
  chat_template: null
  custom_cls:
    path: null                # set by training/scripts/train_sft.sh to training/sigma_rl/dataset.py
    name: SigmaSFTDataset
  use_shm: False
model:
  partial_pretrain: /mnt/data/peilin/HF_MODEL/Qwen3-4B
  use_shm: False
  fsdp_config:
    model_dtype: fp32
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: True
  trust_remote_code: False
  lora_rank: 0                # full parameters only
  use_liger: False
  strategy: fsdp
  attn_implementation: flash_attention_2
optim:
  lr: 5e-6
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_steps_ratio: 0.03
  clip_grad: 1.0
  lr_scheduler: cosine
ulysses_sequence_parallel_size: 1
use_remove_padding: True
trainer:
  default_local_dir: outputs/rl/${trainer.experiment_name}
  default_hdfs_dir: null
  resume_path: null
  project_name: sigma-mem-sft
  experiment_name: q3_4b_sft_hinted_memory
  total_epochs: 1
  total_training_steps: null
  logger: [ 'console' ]
  seed: 1
  save_freq: -1
  test_freq: -1
  nnodes: 1
  n_gpus_per_node: 4
  max_ckpt_to_keep: null
