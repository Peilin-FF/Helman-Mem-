# Robustness: the six peers answer with misleading but relevant solutions (README_adversarial.md).
# Start with:  bash run_adversarial.sh --smoke        (reads this file; --regimes / --steps / --gpus / --smoke override it)
#
# The honest pipeline is unchanged.  Only the peers' answers are: scripts/adversarial_peers.py re-generates each peer's
# answer until it is verified wrong, on topic, in the right format and free of any hint that it is wrong on purpose;
# scripts/build_adversarial_stream.py puts those answers into a copy of the six-peer stream under a regime, recomputing
# every label.  The central model, the record's equations, the tilt and the grading are exactly those of the main runs,
# so a row of the adversarial table is comparable, event for event, with the honest row.

gpus: [0, 1, 2, 3, 4, 5, 6, 7]     # nvidia-smi first: the box is shared. One task per GPU at a time.

models_root: /mnt/data/peilin/HF_MODEL

central:                           # the model that reads the peers and answers; also the frozen judge that addresses the record
  tag: q3_4b                       # names the feature caches and the output directories
  path: Qwen3-4B
  engine: vllm
  # env: sigma3_5                  # a conda env for a model the default env cannot load (as in families.yaml)
  # shards: 8                      # evaluation shards for the HF engine

peers:                             # the six peers of the streams, in peer_0 .. peer_5 order (the order the streams carry)
  - {index: 0, name: gemma-3-4b-it}
  - {index: 1, name: Phi-4-mini-instruct}
  - {index: 2, name: Qwen2.5-Coder-7B-Instruct}
  - {index: 3, name: Meta-Llama-3.1-8B-Instruct}
  - {index: 4, name: DeepSeek-Coder-V2-Lite-Instruct, env: {VLLM_USE_V1: 0}}   # its MLA attention has no working
                                          # chunked-prefill path in vLLM 0.8.5's V1 engine without FlashAttention 3
                                          # (A100): "MLACommonMetadataBuilder object has no attribute page_size"
  - {index: 5, name: DeepSeek-R1-Distill-Qwen-7B, reasoning: true}   # thinks first; graded on the text after </think>

streams:
  test: [ood6, indist6]            # the whole OOD stream (17,403 events) and the whole in-distribution stream (4,319); longest first
  fit: self                        # PCA addresses fit on each test stream's own features (label-free) -- no train stream is
                                   # encoded, and the addresses see the adversarial answers, as they would in deployment.
                                   # "train6" instead fits them on the honest training stream (the families protocol).

regimes:                           # which peers answer adversarially, on which events (feedback_state/adversarial.py)
  all100:
    kind: fraction
    rate: 1.0
    peers: all
    note: "every answer of every peer is misleading, the floor of the experiment: the peers are pure poison, so reading
           them has to hurt, and the memory can at best take their weight away again"
  saboteurs2:
    kind: fraction
    rate: 1.0
    peers: [1, 4]                  # Phi-4-mini-instruct and DeepSeek-Coder-V2-Lite-Instruct
    note: "two peers always lie and four answer honestly: the record should find the two and take their weight away"
  all50:
    kind: fraction
    rate: 0.5
    peers: all
    note: "half of every peer's answers are poisoned, a different half per peer, so reliability is a property of the
           question and the answer rather than of the peer, which is what the record is addressed by"
  flip:
    kind: flip
    at: 0.5
    peers: [1, 4]
    note: "two peers are honest for the first half of the stream and misleading afterwards: the record has to change
           its mind about a peer it has learned to trust"
  targeted:
    kind: targeted
    rate: 1.0
    peers: all
    note: "every peer is misleading exactly on the events it answered correctly, the worst case: there is no useful
           answer left for the memory to promote"

sweep:                             # the dose-response curve: the same experiment at a series of poison ratios.
  rates: [0.0, 0.25, 0.5, 0.75, 1.0]   # 0 is the honest stream rebuilt through the identical steps (the control);
  peers: all                           # 1.0 is as much as the peers can be made to get wrong. Names: p000 ... p100.
  exact: true                      # the rate is what the stream ends up with, not what was asked for before the
                                   # peers' refusals are subtracted -- and the selections nest, so a higher rate
                                   # poisons the events of the lower one plus more.
  prefix: p
  counts: [0, 1, 2, 3, 4, 5, 6]   # the other dial -> k0 ... k6: exactly that many of the six peers misleading on every
                                   # event, a different set each time (minority vs majority lying)

run: [all100, saboteurs2, all50]   # the regimes to build and evaluate, in this order.  In a run list or --regimes,
                                   # "rates" = p000 ... p100, "counts" = k0 ... k6, "sweep" = both; flip and targeted are
                                   # one flag away, and any pNNN (e.g. p030) or kN (e.g. k2) works as is.
steps: [peers, streams, features, prompts, eval, table]   # each step skips work already on disk, so a run can be resumed

generation:                        # scripts/adversarial_peers.py
  max_attempts: 3                  # generations per event before the forcing pass
  temperatures: "0.2,0.7,1.0"      # attempt 0 samples exactly as the honest peers did
  force: true                      # rewrite the conclusion of a math / multiple-choice / yes-no answer that stays correct
  grade_workers: 8
  max_model_len: 8192
  gpu_memory_utilization: 0.85
  root: outputs/peer_adv           # <root>/<stream>/<peer name>/<split>.shard*.jsonl, generated once and reused by every regime

features:                          # scripts/encode_context_features.py, the central model as the frozen judge
  num_peers: 6
  max_length: 8192
  dtype: bfloat16
  progress_every: 500

memory:                            # scripts/build_generation_prompts.py: the Bayesian record along the stream
  design: qc
  dim: 256
  lam: 100.0
  order: shuffled0                 # the stream order; the flip regime is defined in this order

evaluation:                        # tests/experiments/common/evaluate_memory_generator.py
  engine: vllm
  conditions: [tilt, peers, solo, swap]   # swap = the tilt with the record permuted by rank (the control that says the
                                          # gain is the record's content, not the tilt); drop it to save a quarter of the time
  gamma: 3.0
  max_new_tokens: 768
  thinking: "off"
  gpu_memory_utilization: 0.85

outputs:
  features: outputs/context_features        # <tag>_<stream>_adv_<regime>_ph/*/shard*.pt
  streams: data                             # <stream>_adv_<regime>/<split>.jsonl + manifest.json
  prompts: outputs/gen                      # <tag>/prompts_<stream>_adv_<regime>_probe.jsonl, record_<stream>_adv_<regime>.json
  evals: outputs/gen/adversarial            # <tag>/<regime>/<indist|oodfull>6_<cond>/eval_metrics.json, table.md
  honest: outputs/gen/q3_4b/base6_nothink   # the honest rows of the same central model, for the comparison column

smoke:                             # --smoke: the whole pipeline on a few events, ~15 min, one regime
  events: 48
  dim: 32
  suffix: _smoke
  regimes: [p050, all100]          # one rate of the sweep (the exact-ratio path) and the everything-poisoned regime
  peers_root: outputs/peer_adv_smoke
