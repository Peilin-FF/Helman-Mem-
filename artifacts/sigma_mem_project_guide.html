    "html": "\u003csection id=\"sigma\"\u003e\u003ch2\u003e3. 原版 Σ-Mem：能力矩阵 + 关系矩阵\u003c/h2\u003e\u003cdiv class=\"grid col-2\"\u003e\u003cdiv class=\"card\"\u003e\u003ch3\u003e每位同伴一张能力矩阵 $M_p$\u003c/h3\u003e\u003cp\u003e把题目编码为方向 $\\phi_t$，用正确反馈 $s_{p,t}\\in\\{-1,+1\\}$ 更新：\u003c/p\u003e\u003cp\u003e$$M_{p,t}=\\gamma M_{p,t-1}+\\eta\\,s_{p,t}\\phi_t\\phi_t^\\top$$\u003c/p\u003e\u003cp\u003e$\\gamma$ 控制旧经验保留多少，$\\eta$ 控制新反馈写入多强。外积写入保持矩阵对称；单位长度的地址使单次写入幅度受控。默认地址先比较题目与训练任务原型的相似度，再投影到 16 维。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"card\"\u003e\u003ch3\u003e同伴之间一张关系矩阵 $G$\u003c/h3\u003e\u003cp\u003e从各同伴的对错向量积累成对关系，表达共同成功或共同失败的模式。它由评测器单独维护，没有塞进 \u003ccode\u003eSymmetricTrustMemory\u003c/code\u003e 类。\u003c/p\u003e\u003cp\u003e启用 \u003ccode\u003e--graph_posterior ising\u003c/code\u003e 时，评测器把中央模型评分与 $G$ 组合，枚举对错状态求边缘分数。实现枚举 $2^P$ 个状态，适合仓库主要研究的少量同伴。\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e中央模型给每个候选答案做同一种 Yes/No 判断，分数是 $\\log P(\\mathrm{Yes})-\\log P(\\mathrm{No})$。记忆读出的 $M_p\\phi_t$ 经投影后，通过 \u003ccode\u003eActivationSteerer\u003c/code\u003e 注入上半部分解码层的隐藏状态，影响中央模型对该候选的判断。\u003c/p\u003e\u003cp\u003e原版默认冻结中央模型参数。离线优化的是地址投影、写入强度、遗忘参数和注入层等小模块；在线变化的是记忆状态。\u003c/p\u003e\u003cp class=\"note\"\u003e代码依据：\u003ca href=\"../feedback_state/symmetric_memory.py\"\u003esymmetric_memory.py:23、116、148、245\u003c/a\u003e；\u003ca href=\"../feedback_state/joint_models.py\"\u003ejoint_models.py:56\u003c/a\u003e；\u003ca href=\"../tests/experiments/common/evaluate_sigma.py\"\u003eevaluate_sigma.py:145、163、445\u003c/a\u003e；\u003ca href=\"../configs/symmetric_memory_candidate_yesno.yaml\"\u003e默认配置\u003c/a\u003e。\u003c/p\u003e\u003c/section\u003e"

    "html": "\u003csection id=\"kalman\"\u003e\u003ch2\u003e4. Kalman 版本：记住经验，也量化不确定性\u003c/h2\u003e\u003cp\u003e新版本把可靠性建模成线性回归：给定地址 $\\psi$，预测同伴回答的符号正确性 $s$。在代码假设的线性高斯模型下，可以直接维护精确后验：\u003c/p\u003e\u003cp\u003e$$\\Lambda=\\lambda I+\\sum_i\\psi_i\\psi_i^\\top,\\qquad b=\\sum_i s_i\\psi_i,\\qquad \\mu(\\psi)=\\psi^\\top\\Lambda^{-1}b$$\u003c/p\u003e\u003cp\u003e同时读出预测方向上的不确定性，并转成可靠性分数：\u003c/p\u003e\u003cp\u003e$$v(\\psi)=\\psi^\\top\\Lambda^{-1}\\psi,\\qquad p(\\psi)=\\Phi\\!\\left(\\frac{\\mu(\\psi)}{\\sqrt{1+v(\\psi)}}\\right)$$\u003c/p\u003e\u003cp\u003e没有历史证据时，预测回到 0.5。观察到更多相似例子后，预测均值和不确定性共同变化。实现用 Sherman–Morrison 更新逆矩阵，避免在每次无遗忘写入时重新求逆；\u003ccode\u003erho &lt; 1\u003c/code\u003e 分支则保留精度矩阵，并在读取时做 Cholesky 求解。\u003c/p\u003e\u003cdiv class=\"callout\"\u003e\u003cdiv class=\"callout-h\"\u003e地址决定了它能学到什么\u003c/div\u003e\u003cp\u003e默认 \u003ccode\u003eqc\u003c/code\u003e 地址把“按同伴身份分块的问题表示”和“共享的候选答案表示”拼接起来。因此它同时学习同伴的能力差异，以及答案本身的正确性线索。\u003ccode\u003esem\u003c/code\u003e 来自包含候选答案的 judge prompt，不能因为名称里有 question 就把它理解为纯问题特征。\u003c/p\u003e\u003c/div\u003e\u003cp\u003e读出的证据还可以交给 \u003ccode\u003eMemoryJudge\u003c/code\u003e：四维证据向量包含该候选的可靠性、证据量，以及其他候选的最大和平均可靠性。Judge 通过 LoRA、隐藏状态注入和一个可学习系数，将自己的判断与记忆的 log-odds 融合。\u003c/p\u003e\u003cp class=\"note\"\u003e“精确”指对所设定线性高斯回归模型的后验计算；二元正确性的概率校准仍需实验验证。代码依据：\u003ca href=\"../feedback_state/kalman_memory.py\"\u003ekalman_memory.py\u003c/a\u003e；\u003ca href=\"../feedback_state/addresses.py\"\u003eaddresses.py:25、66、95\u003c/a\u003e；\u003ca href=\"../feedback_state/feature_streams.py\"\u003efeature_streams.py:1\u003c/a\u003e；\u003ca href=\"../feedback_state/memory_judge.py\"\u003ememory_judge.py:28、63\u003c/a\u003e。\u003c/p\u003e\u003c/section\u003e"

    "html": "\u003csection id=\"learning\"\u003e\u003ch2\u003e5. 新的研究目标：从“会挑答案”到“自己会解题”\u003c/h2\u003e\u003cp\u003e只从同伴答案中选择，成绩受到“至少有一位同伴答对”的上限约束。仓库新增了生成路径：让中央模型看同伴答案和可靠性注释，生成自己的完整答案；也可以把中央模型自己的答案作为额外来源，加入记忆驱动的选择或投票。\u003c/p\u003e\u003cp\u003e更进一步，\u003ccode\u003etraining/sigma_rl/\u003c/code\u003e 尝试将这种协作收益学进参数。它在 vendored verl 上使用 GRPO，借助 Ray、FSDP 与 vLLM 完成多卡训练。默认同时采样只看题目的 solo 答案，以及看同伴和记忆的 guided 答案；判分后，guided 答案可分别在带提示和只看题目的输入下参与训练。\u003c/p\u003e\u003cp\u003e这里最值得关注的两项指标分别是：\u003cstrong\u003e协作当时生成的答案是否更好\u003c/strong\u003e，以及\u003cstrong\u003e训练后的模型只看题目时是否更强\u003c/strong\u003e。第二项才检验同伴知识是否真正进入中央模型自身。\u003c/p\u003e\u003cp class=\"note\"\u003e代码依据：\u003ca href=\"../feedback_state/memory_generator.py\"\u003ememory_generator.py\u003c/a\u003e；\u003ca href=\"../scripts/self_vote_sim.py\"\u003eself_vote_sim.py\u003c/a\u003e；\u003ca href=\"../training/sigma_rl/trainer.py\"\u003etrainer.py:85\u003c/a\u003e；\u003ca href=\"../training/configs/grpo_sigma.yaml\"\u003egrpo_sigma.yaml:247\u003c/a\u003e；\u003ca href=\"../training/README.md\"\u003etraining/README.md\u003c/a\u003e。\u003c/p\u003e\u003c/section\u003e"
