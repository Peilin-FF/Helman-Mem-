    "html": "<div class=\"eyebrow\">RESEARCH REVIEW · 10 SEPTEMBER 2026<\/div><h1>Σ-Mem: what is the strongest paper here?<\/h1><p class=\"lede\">The strongest current result is that historical reliability can improve how an LLM uses peer answers at inference. The evidence for an additional benefit from training with that memory is much weaker.<\/p><div class=\"callout rec\"><div class=\"callout-h\">My assessment<\/div><p>This is a substantial research project with useful positive results and unusually informative controls. I would not yet present the current combination of Bayesian linear memory, attention reweighting, and GRPO as a convincing top-conference algorithmic contribution. The main blockers are <b>novelty, attribution, and evaluation design<\/b>. A focused paper about when historical reliability helps collaborative generation is more defensible.<\/p><\/div><p>Scope: the original symmetric Σ-Mem and the latest Bayesian linear record / six-peer attention experiments. The recommendation emphasizes the latest work. Venue fit is my judgment; no particular venue or paper direction has been confirmed.<\/p><div class=\"toc\"><a href=\"#evidence\">Existing evidence<\/a><a href=\"#objections\">Reviewer objections<\/a><a href=\"#novelty\">Closest work<\/a><a href=\"#direction\">Paper direction<\/a><a href=\"#experiments\">Decisive experiments<\/a><a href=\"#writing\">Writing structure<\/a><\/div>"

    "html": "<h2 id=\"objections\">The objections I would expect from a strong reviewer<\/h2><div class=\"review blocking\"><div class=\"avatar\">1<\/div><div class=\"bubble\"><div class=\"who\">What is new beyond existing credibility weighting?<\/div><p>Bayesian linear regression / recursive least squares is established. Credibility-based attention modification is also established. The contribution must be the <b>online estimation and use of task-conditioned reliability under a clearly specified feedback regime<\/b>, supported by comparisons that isolate it. A new name for the state or a standard matrix identity will not resolve this objection.<\/p><\/div><\/div><div class=\"review blocking\"><div class=\"avatar\">2<\/div><div class=\"bubble\"><div class=\"who\">Does memory learn source reliability or verify the current answer?<\/div><p>The default record uses candidate-conditioned judge features. Its “question” representation <code>sem<\/code> is pooled from prompts that contain peer responses; it is not question-only. High AUC may therefore reflect an online answer verifier as well as a record of peer competence. Compare question-only source memory, a shared candidate verifier, and their combination with identical features and labels. A response-free routing claim must use genuinely question-only inputs.<\/p><\/div><\/div>"

    "html": "<div class=\"review blocking\"><div class=\"avatar\">3<\/div><div class=\"bubble\"><div class=\"who\">How independent is the evaluation?<\/div><p>The data builders take a 512-example validation subset from the same in-distribution stream later reported as a 4,319-example test set. When validation drives checkpoint or hyperparameter selection, reporting the encompassing stream is not a fully held-out estimate. Freeze a disjoint final test set and specify the development decisions already made on the current streams.<\/p><p>The main training comparisons are not replicated across independent training seeds. The latest generation OOD evaluation is a quarter-stream subset. These limitations matter particularly for the approximately one-point training difference.<\/p><\/div><\/div>"

    "html": "<div class=\"review blocking\"><div class=\"avatar\">4<\/div><div class=\"bubble\"><div class=\"who\">Which feedback is available, to whom, and at what cost?<\/div><p>The current record receives all peers’ correctness labels after each event. That is full feedback, even though it arrives after the decision. It is a legitimate setting, but it differs from learning from only the selected peer’s outcome. Explain an application where these labels arrive, their delay, and their cost.<\/p><p>The reduced-verifier training builder masks central rewards <em>after<\/em> loading a trajectory already constructed with every peer label. That can study scarce central-model rewards with fully observed peer feedback. It cannot support a claim that the memory itself learned with the same scarce feedback unless the trajectory is rebuilt under that mask.<\/p><\/div><\/div>"

    "type": "html",
    "html": "<div class=\"review blocking\"><div class=\"avatar\">5<\/div><div class=\"bubble\"><div class=\"who\">Do the diagnostic metrics mean what the paper says?<\/div><p>The striking “minority favorite is correct” numbers use the majority of <em>correctness labels<\/em>, not the most frequent answer. Several different wrong answers share the same label. This retrospective slice cannot demonstrate that the system overrules an observable wrong consensus with 98–99% accuracy.<\/p><p>Define agreement from canonicalized answer texts before consulting labels; then evaluate the chosen answer. Likewise, “more than half the peers are correct” differs from the accuracy of plurality voting on multi-answer tasks.<\/p><\/div><\/div>"

    "html": "<div class=\"review\"><div class=\"avatar\">6<\/div><div class=\"bubble\"><div class=\"who\">How much additional computation buys the gain?<\/div><p>Include peer generation, candidate-feature extraction, online record updates, and the attention backend. Cached features still have an acquisition cost in a deployed system. The record update can be cheap while the complete method is expensive.<\/p><p>The saved run3b logs average approximately <b>105 seconds per training step with attention steering versus 53 seconds for the peers-only control<\/b>. This is an observed implementation cost, not an intrinsic algorithmic lower bound. Match training examples and generation budgets, and separately compare quality at equal wall-clock or total-token budgets.<\/p><\/div><\/div>"

    "type": "html",
    "html": "<h2 id=\"novelty\">Closest prior work and the distinction you need<\/h2><div class=\"grid col-2\"><div class=\"card\"><h3>CrAM is the closest attention baseline<\/h3><p><a href=\"https://arxiv.org/abs/2406.11497\">CrAM, AAAI 2025<\/a> already scales attention to external documents using credibility scores and selects influential heads. Your current mechanism uses online feedback-derived peer scores, a different normalization, and all-head application. That creates a testable distinction, not an automatic novelty claim. Compare score estimators with the reader fixed, then attention readers with the scores fixed.<\/p><\/div><div class=\"card\"><h3>Learning to consume credibility also exists<\/h3><p><a href=\"https://aclanthology.org/2024.emnlp-main.1109/\">Credibility-aware Generation, EMNLP 2024<\/a> trains models to use credibility information. Establish whether historical reliability adds something beyond credibility-conditioned generation and ordinary peer-conditioned training. Your existing train-by-inference matrix is the right starting design.<\/p><\/div><div class=\"card\"><h3>Online model selection has strong predecessors<\/h3><p><a href=\"https://proceedings.iclr.cc/paper_files/paper/2025/hash/5503a7c69d48a2f86fc00b3dc09de686-Abstract-Conference.html\">RouteLLM, ICLR 2025<\/a> learns routing from preferences. <a href=\"https://aclanthology.org/2025.findings-emnlp.1301/\">PILOT, Findings of EMNLP 2025<\/a> adapts routing through bandit feedback. Your answer-synthesis interface differs from pre-generation routing. Compare within a common information and cost budget, and avoid presenting post-decision feedback as unprecedented.<\/p><\/div><div class=\"card\"><h3>Fast learning and outcome training are foundations<\/h3><p><a href=\"https://arxiv.org/abs/2407.04620\">TTT layers<\/a> and <a href=\"https://arxiv.org/abs/2412.06464\">Gated DeltaNet<\/a> already connect recurrent state updates to learning rules. Your state operates across externally labeled events rather than self-supervised token updates. <a href=\"https://arxiv.org/abs/2203.14465\">STaR<\/a> and <a href=\"https://arxiv.org/abs/2501.12948\">DeepSeek-R1<\/a> also make reasoning training and post-generation evaluation established context. These distinctions belong explicitly in related work.<\/p><\/div><\/div><p class=\"note\">This is a targeted check of close primary sources, not an exhaustive novelty search.<\/p>"

    "type": "html",
    "html": "<h3>Mathematical claims to tighten before writing<\/h3><p><b>Exactness:<\/b> the state is exact Bayesian linear regression for a Gaussian observation model on signed targets. That does not make its transformed output an exact, calibrated Bernoulli correctness posterior. Regression and classification use different likelihoods; see <a href=\"https://gaussianprocess.org/gpml/chapters/\">Rasmussen and Williams, chapters 2–3<\/a>.<\/p><p>A simple analytical example exposes the difference: repeatedly observe the same scalar address $x=1$ with target $s=+1$. After $n$ observations, the implementation has $\\mu_n=n/(\\lambda+n)$ and $v_n=1/(\\lambda+n)$. Consequently, its reported probability tends to $\\Phi(1)\u0007pprox0.8413$, even though every observed outcome is correct. Call this a Gaussian-surrogate score unless held-out calibration supports a probability claim.<\/p><p><b>Order and dynamics:<\/b> with no forgetting, the final sufficient statistics are invariant to event order. Online decisions use different prefixes and need not have invariant accuracy. Stationary order robustness and adaptation to changing reliability need separate evaluation.<\/p><p><b>Regret and stability:<\/b> a ridge-regression loss bound does not automatically bound peer-selection error or generated-answer regret. A bounded spectral update does not guarantee bounded changes in an LLM’s discrete answer. State assumptions and the exact predicted quantity.<\/p><p><b>“Optimal” and “information ceiling”:<\/b> conditional-independence voting guarantees require an explicit answer-error model. A fitted ridge or nearest-neighbor benchmark estimates one predictor’s performance; it is not an information-theoretic upper bound.<\/p>"
  },

  {
    "type": "html",
    "html": "<h2 id=\"direction\">The paper I would build from this project<\/h2><div class=\"callout rec\"><div class=\"callout-h\">Recommended thesis<\/div><p><b>Historical outcome feedback can provide useful credibility information beyond a model’s immediate assessment of peer answers; an explicit reliability record turns that information into improved generation.<\/b><\/p><p>The unresolved scientific question is where that historical information matters, and whether the proposed estimator and interface exploit it better than simpler alternatives. Make that question the organizing principle.<\/p><\/div><p><b>Working title:<\/b> <em>When Does Reliability Memory Help Multi-Model Reasoning?<\/em> This accommodates the positive inference results and the weak training effect. If the decisive comparisons establish a stronger mechanism, a method-oriented title such as <em>Online Reliability Memory for Credibility-Aware Generation<\/em> becomes appropriate.<\/p><div class=\"grid col-2\"><div class=\"card\"><h3>Strongest near-term direction<\/h3><p>Study online reliability-guided inference, with a controlled benchmark of peer replacement, changing competence, and incomplete feedback. Show the gap between predicting reliability and successfully using it. This is a plausible NLP empirical-method paper if the evidence generalizes across model families and strong baselines.<\/p><\/div><div class=\"card\"><h3>Higher-risk extension<\/h3><p>Develop a reader that decides both <em>which peer to trust<\/em> and <em>whether to rely on peers at all<\/em>, using uncertainty and a record of the central model’s own success. The current relative weights leave the best peer unsuppressed even when all peers are weak; the flat-record bypass also needs consideration. Treat this as an untested proposal, not an existing result or guaranteed novelty.<\/p><\/div><\/div><p>For an ML venue, the case would be stronger with a new estimation/control result or a compelling, broadly replicated finding beyond the standard components. I would deprioritize additional long GRPO runs until the inference mechanism wins the closest comparisons.<\/p>"

    "html": "<h3>An evidence-aligned abstract draft<\/h3><div class=\"card\"><p>Large language models can draw on peer responses to solve tasks, but the reliability of those responses varies across sources and questions. We study how historical outcome feedback can guide a central model’s use of peer answers. Our system maintains a Bayesian linear record of candidate correctness and uses its scores to reweight attention to peer responses, updating the record after each decision. A factorial evaluation separates the effects of peer-conditioned training and reliability-guided inference. In existing Qwen3-4B experiments with six peers, the inference intervention improves a frozen model from 64.76% to 67.19% on 4,319 in-distribution examples and from 69.59% to 73.78% on a 4,351-example OOD subset. Models trained without reliability weighting also benefit from the intervention, whereas training with it provides no consistent OOD advantage over the matched peer-trained control. These findings motivate treating reliability estimation and the model’s use of reliability as distinct components of collaborative reasoning.<\/p><\/div><p class=\"note\">This describes the current evidence. A submission abstract still needs the closest-baseline results, replication, and an independently held-out final evaluation before claiming a broadly superior method.<\/p>"
