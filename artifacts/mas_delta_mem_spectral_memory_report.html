[
  {"type":"html","html":"<div class=\"eyebrow\">MAS diagnosis</div><h1>Delta-Mem 在 MAS 反馈里的失配，以及一个谱稳定记忆方案</h1><p class=\"lede\">结论先行：中央模型做选择时不是只看 state，它看的是 question / context / 所有 peer answers 组成的 joint prompt，同时 memory state 通过 Delta-Mem 读路径 steer logits。现在异常结果的核心不是 CM 没有看到答案，而是当前 write/steer 机制把“当前样本内容重编码”学成了主通道，真正的 online feedback 基本没有被有效读到。</p><div class=\"summary-band\"><div><span class=\"k\">当前判断</span>Delta-Mem token-level write 不适合直接承载多 agent 间长期反馈</div><div><span class=\"k\">优先方案</span>先做显式 per-example trust memory + logit fusion</div><div><span class=\"k\">谱矩阵思路</span>可行，但要靠有界/门控更新，不是 Weyl 自动过滤噪声</div></div>"},
  {"type":"html","html":"<h2>1. 中央模型决策时到底吃什么？</h2><div class=\"callout olive\"><div class=\"callout-h\">明确结论</div><p>选择阶段 CM 收到的是完整 joint prompt：<code>Question</code>、可选 <code>Context / Evidence</code>、每个 peer 的完整回答，以及最后的 <code>Answer:</code>。然后候选 <code> Peer s</code> 通过 autoregressive log-prob 打分。它不是“只 fed state”。</p></div><div class=\"grid col-2\"><div class=\"card\"><h3>代码证据</h3><ul><li><code>feedback_state/joint_prompt.py::build_joint_prompt</code> 明确拼入 question、context、所有 peer response。</li><li><code>train_joint_selector.py</code> selection/read phase 调 <code>build_joint_prompt(... slot_texts ... context=...)</code>，再对每个 slot 计算 <code>score_one_candidate</code>。</li><li><code>eval_feedback_algo.py</code> 推理也用同样 selection prompt，然后 score 每个 <code>Peer s</code>。</li></ul></div><div class=\"card\"><h3>需要区分</h3><p>state 不是替代 prompt 的输入，而是 Delta-Mem 读路径的附加 steering source。也就是说：<b>prompt 提供当前题和答案，state 试图提供历史/反馈偏置</b>。当前问题在 state 的写入和读出，不在 CM 看不到答案。</p></div></div>"},
  {"type":"html","html":"<h2>2. 为什么 trS=0 / 关闭 feedback 反而更好并不反常？</h2><div class=\"callout clay\"><div class=\"callout-h\">这是诊断信号，不是小 bug</div><p><code>current_method_explained.html</code> 里的结果指向同一个事实：写入机制贡献的主要不是 feedback，而是当前样本的 content-steer；这个 content-steer 在 counterfactual stream 上是 net harmful。</p></div>"},
  {"type":"table","head":["观察","说明","含义"],"rows":[["trS ablation 几乎不变","不加载训练保存的 trust_state 后，结果没有明显变化","训练集偏置主要不在保存的 trS 里"],["reset vs accumulate 几乎不变，尤其 Algorithm B","B 每个样本先把长 content prompt 写进同一个 S，再 scoring","跨样本 feedback 在选择前已被当前 content 覆盖"],["read-only ≈ online","只做 content write、没有 feedback write 时，结果和 online 几乎一样","online feedback 对最终决策贡献接近 0"],["NO-WRITE 冷启动最好或更稳","S=0 且 write off，读路径 steering 为 0，只剩 frozen backbone joint prompt","当前 write/steer 通道学到了有害的内容/位置捷径"]]},
  {"type":"html","html":"<h2>3. Delta-Mem 机制和 MAS feedback 的错位</h2><div class=\"card\"><p>Delta-Mem 的核心 update 是逐 token 的 affine scan。代码里每个 token 都执行：</p><pre><code>read_t = S_t q_t\npred_t = S_t k_t\nS_{t+1} = keep_t * S_t - erase_t * pred_t k_t^T + write_t * v_t k_t^T</code></pre><p>这适合把当前上下文流式压进一个小状态，但不适合把“某个 peer 最近是否可靠”作为长期、离散、可寻址的反馈信号来保存。</p></div><div class=\"grid col-2\"><div class=\"card\"><h3>为什么会擦掉 feedback</h3><p>feedback write 很短，例如 <code>Peer j: Feedback: correct</code>。但下一题选择前，当前 question + context + 三个长回答会被 token-level 写入。若平均 keep≈0.982，约 800 token 后旧信号只剩 <code>0.982^800 ≈ 4.9e-7</code> 的量级。即使 labels-only 是为了“活过 survival window”，它仍然会被下一轮 content write 压过去。</p></div><div class=\"card\"><h3>训练 / 推理 context 也要小心</h3><p>Delta-Mem 推理不是“只靠 memory”，它仍然依赖当前 prompt/context。训练时可以让 feedback write prompt 不含 context，这是 labels-only 的设计；但选择阶段的训练和推理仍应保持同构：当前 question/context/answers 必须在 selection prompt 里，否则训练到的是另一个任务。</p></div></div>"},
  {"type":"html","html":"<h2>4. 对称矩阵 + Weyl 这条想法：有价值，但要补上 update 规则</h2><div class=\"callout olive\"><div class=\"callout-h\">可以用，但不能直接神化</div><p>对实对称矩阵，Weyl 型稳定性告诉我们：若扰动矩阵 <code>E</code> 的谱范数小，则 <code>A+E</code> 的特征值变化也小，形式上可写成 <code>max_i |lambda_i(A+E)-lambda_i(A)| <= ||E||_2</code>。这确实说明“谱”是一个比任意 hidden state 坐标更稳的表征空间。</p></div><div class=\"callout clay\"><div class=\"callout-h\">但它不会自动过滤噪声</div><p>Weyl 只说小扰动造成小特征值变化；它没有保证 online 噪声一定小，也没有保证随机小扰动长期累积后仍小。要让“只有关键信号改变 memory 矩阵的特征值”，必须设计一个让普通噪声的 operator norm 被压小、被抵消、或被门控拒绝的 update。</p></div>"},
  {"type":"html","html":"<h2>5. S4 能给什么启发？</h2><div class=\"grid col-2\"><div class=\"card\"><h3>不要误读成“实对称矩阵 memory”</h3><p><code>/workspace/cloud_android/fengpeilin/s4</code> 里的 S4 核心更接近 structured stable state space：HiPPO / NPLR / DPLR。代码里 <code>rank_correction</code> 是为了让矩阵加低秩校正后接近 normal；<code>nplr</code> 对近 skew-symmetric 的结构用 <code>eigh</code> 对角化；DPLR 初始化强制状态矩阵对角实部为负。</p></div><div class=\"card\"><h3>真正可借鉴的点</h3><p>S4 的重要经验不是“矩阵必须对称”，而是：把长期状态的动力学约束在稳定的谱结构里，例如 normal / contractive / diagonal-plus-low-rank，并用可控的读出映射。这和 MAS feedback 更匹配的方向是：<b>稳定 per-example recurrence 或谱约束 trust memory</b>，不是继续让每个 token 都改写同一个小 S。</p></div></div>"},
  {"type":"html","html":"<h2>6. 建议的新路线：显式谱 trust memory，先接到 logits</h2><div class=\"callout rec\"><div class=\"callout-h\">我建议先不要改 CM attention steering</div><p>第一版应该让 feedback 以最短路径影响选择：<code>score_j = LM_logp_j + trust_bias_j</code>。如果 logit-level trust 都打不过 no-write backbone，再把它塞进 attention state 只会更难 debug。</p></div><div class=\"card\"><h3>一个具体设计</h3><pre><code>for each task/peer j:\\n  M_j in R^{d x d}, M_j = M_j^T\\n\\nper example feedback:\\n  y_j = +1 if peer j correct else -1\\n  u_j = normalize(phi(question, short_answer_j, task_type))\\n  surprise_j = y_j - expected_j\\n  gate_j = drift_or_consistency_gate(surprise history)\\n  Delta_j = eta * gate_j * y_j * u_j u_j^T\\n  Delta_j = spectral_clip(Delta_j, max_norm=eta_max)\\n  M_j <- (1-rho) M_j + Delta_j\\n  M_j <- symmetrize(M_j)\\n\\nread:\\n  trust_bias_j = alpha * readout(eigvals(M_j), trace(M_j), u_current^T M_j u_current)</code></pre><p>这里每次 update 是 per example / per peer，而不是 per token；对称性保证特征值可解释且扰动有谱界；<code>gate</code> 和 <code>spectral_clip</code> 才是抵抗普通噪声的关键。</p></div>"},
  {"type":"html","html":"<h2>7. S4-like 版本：稳定 recurrence，而不是 token write</h2><div class=\"card\"><p>如果想更贴近 S4，可以把 feedback 序列建模成一个稳定线性系统：</p><pre><code>z_t = A z_{t-1} + B f_t\\ntrust_bias_t = W z_t</code></pre><p>其中 <code>f_t</code> 是当前样本的结构化反馈特征，例如 peer id、task type、correctness、answer confidence、surprise；<code>A</code> 约束成 contractive/normal，例如离散化后谱半径小于 1，或由负定对称矩阵、orthogonal+decay、DPLR 参数化生成。这个比“把 Delta-Mem 的 S 强行变对称”更像 S4 的思想。</p></div>"},
  {"type":"html","html":"<h2>8. 实验顺序</h2><div class=\"timeline\"><div class=\"tl-entry\"><div class=\"tl-time\">Step 0</div><div class=\"tl-body\"><b>冻结 no-write backbone 作为硬基线</b>：S=0、write off、完整 joint prompt/context/answers。任何 feedback 方法必须先稳定超过它。</div></div><div class=\"tl-entry\"><div class=\"tl-time\">Step 1</div><div class=\"tl-body\"><b>显式 Bayesian/EMA/ATS trust logit fusion</b>：仓库里已有 <code>feedback_state/trust_scheduler.py.filt_backup</code> 的 ATS 草案，先把同一 feedback 信号接到 logits。它是最便宜、最可解释的 sanity baseline。</div></div><div class=\"tl-entry\"><div class=\"tl-time\">Step 2</div><div class=\"tl-body\"><b>对称谱 trust memory</b>：实现上面的 <code>M_j</code>，记录 eigenvalue movement、spectral norm、bias 大小和准确率。</div></div><div class=\"tl-entry\"><div class=\"tl-time\">Step 3</div><div class=\"tl-body\"><b>只有 logit-level 有稳定收益后，再尝试 attention steering</b>：例如只让谱 trust 产生一个小的 candidate bias 或 gate，不再让长 content prompt token-level 写入同一长期 state。</div></div></div>"},
  {"type":"html","html":"<h2>9. 我对当前问题的判断</h2><div class=\"callout clay\"><div class=\"callout-h\">Delta-Mem 原样不适合这个 MAS feedback 任务</div><p>你的判断基本对：它作为 token-level memory 很适合“当前上下文增强”，但 MAS 的反馈是稀疏、离散、跨样本、按 peer/task 可寻址的信号。把两者塞进同一个逐 token 更新的矩阵，长回答一来，旧 feedback 就会被覆盖或稀释。</p></div><div class=\"callout olive\"><div class=\"callout-h\">谱矩阵方案值得做，但目标要改清楚</div><p>目标不是“利用 Weyl 让噪声天然无效”，而是构造一个 <b>per-example、低维、谱范数受控、门控更新、logit 可读出</b> 的 trust state。这样才真正利用了对称/normal 矩阵的稳定性，同时避开 Delta-Mem 的 token overwrite 问题。</p></div>"},
  {"type":"html","html":"<h2>10. 立刻可做的诊断</h2><div class=\"grid col-2\"><div class=\"card\"><h3>确认 feedback 是否可读</h3><ul><li>固定 content write off，只开 feedback bias，看 accuracy 是否超过 no-write。</li><li>把 feedback label 随机打乱，若结果不降，说明模型没有利用 feedback。</li><li>记录每个 peer 的 bias 与真实 rolling accuracy 的相关性。</li></ul></div><div class=\"card\"><h3>确认 content overwrite</h3><ul><li>在每个样本 content write 前后记录 persistent state 的 norm、cosine、谱范数变化。</li><li>对 B 比较 <code>S_keep</code> vs content write 后的 readout bias。</li><li>对 A 单独记录 F 的贡献和 gate lambda；若 lambda 长期约 0.5 或 F bias 接近 0，说明 trust path 没学到。</li></ul></div></div>"}
