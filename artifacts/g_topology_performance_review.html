    "html": "<h1>G as CM's Peer Topology: Progress Review and Performance Plan</h1><div class=\"callout olive\"><span class=\"tag\">核心结论</span><p class=\"why\" style=\"margin:6px 0 0\">你对 <code>G</code> 的定义应该改成：<b>Center Model 眼中各个 peer 的拓扑关系</b>。这比“联合正确/错误相关性”更对，因为 CM 最终要解决的不是单个 peer 可靠不可靠，而是<b>这些 peer 之间如何互补、冗余、成簇、互相校正</b>。当前代码已经有 <code>G</code> 的状态容器和写入函数，但没有读入 selector，所以它现在不会影响最终结果。要让它涨性能，重点不是把 <code>G</code> 硬塞进 single-pick 分数，而是让 final decision 变成 topology-aware selection / aggregation。</p></div>",

    "html": "<h2>1. 上一阶段进展复盘</h2><div class=\"card\"><p class=\"why\"><b>已经完成的主线：</b>从 oracle <code>s = +/-1</code> 转向可训练、与 peer 数量无关的 <code>JudgeHead(q, answer) -&gt; s in [-1,1]</code>。训练时 judge 参与 optimizer；评测时 judge 冻结，但仍给每个新事件产生 graded quality score。这个设计支持 train-3 / eval-5，因为 judge 输入不包含 peer_id，只有 question 和 answer 的 frozen-CM hidden features。</p><p class=\"why\" style=\"margin-top:6px\"><b>已经接入的记忆主线：</b><code>SymmetricTrustMemory</code> 保留 per-peer <code>M_p</code>，支持 <code>phi_mode=block</code>，也保留 fresh-event cache，让 judge 的 <code>s</code> 可以通过 <code>eta*s*(phi^T w)*w</code> 的路径拿到梯度。smoke 级别已经看到 memory/judge 相关参数有非零梯度。</p><p class=\"why\" style=\"margin-top:6px\"><b>当前风险：</b>smoke 日志里 real 和 ablate 都是 45.83% / 120，说明小样本 smoke 只证明“不炸”和“梯度通”，还没证明 memory 在 end-to-end accuracy 上有效。下一步还需要正式 train/eval sweep。</p></div>",

    "html": "<h2>2. G 当前在代码里的状态</h2><table><thead><tr><th>模块</th><th>现状</th><th>对结果的影响</th></tr></thead><tbody><tr><td><code>feedback_state/symmetric_memory.py</code></td><td><code>G</code> 注册为 <code>P x P</code> buffer；<code>update_joint(o)</code> 做 <code>G &lt;- gamma_G G + eta o o^T</code>；<code>redundancy_penalty(peer, chosen)</code> 已实现。</td><td>状态存在。</td></tr><tr><td><code>configs/symmetric_memory.yaml</code></td><td><code>use_joint: off</code>。</td><td>默认不更新。</td></tr><tr><td><code>train_symmetric_memory.py</code> / <code>eval_symmetric_memory.py</code></td><td>会调用 <code>mem.update_joint(...)</code>，但只有 <code>use_joint:on</code> 时才真正写入。</td><td>可写。</td></tr><tr><td>selector scoring</td><td>当前候选分数仍是 <code>score_one_candidate</code> + <code>mem.steer_vector(M_p)</code>；没有任何调用读取 <code>G</code>。</td><td><b>G 不会影响 accuracy。</b></td></tr></tbody></table><div class=\"callout clay\" style=\"margin-top:10px\"><span class=\"tag\">重要修正</span><p class=\"why\" style=\"margin:6px 0 0\">因此现在不能说“G 已经提升了方法”。准确说法是：<code>G</code> 的 buffer / update / API 已经铺好，但 read path 没接。打开 <code>use_joint:on</code> 目前最多用于事后诊断拓扑结构，不能改变最后预测。</p></div>",

    "html": "<h2>3. 重新定义 G：不是分数矩阵，而是 CM 的 peer topology</h2><div class=\"card\"><p class=\"why\">建议把 <code>G[p,q]</code> 解释为 CM 观测到的 peer-p 和 peer-q 的<b>关系边</b>。这条边不只是“是否一起对/一起错”，而是更宽的拓扑信号：</p><ul class=\"why\"><li><b>冗余 / 相似：</b>两个 peer 经常给出同类 reasoning、同类答案、同类错误；选两个不会带来太多信息增益。</li><li><b>互补 / 校正：</b>两个 peer 的能力覆盖不同，一个常常补另一个的缺口；一起用可能比单独用更稳。</li><li><b>依赖 / 流水线：</b>一个 peer 的输出经常成为另一个 peer 的有效输入，例如 search -&gt; revise -&gt; patch。</li><li><b>派系 / cluster：</b>多个 peer 在某些任务簇上高度同向，不能把它们的共识当成多个独立证据。</li></ul><p class=\"why\" style=\"margin-top:6px\">所以 <code>G</code> 应该属于 CM。peer 自己只拥有执行能力；只有 CM 能观察所有 peer 的联合表现，并形成“谁和谁在系统里是什么关系”的拓扑地图。</p></div>",
    "type": "html"

  {
    "html": "<h2>4. 为什么 single-pick 里 G 很难涨分</h2><div class=\"card\"><p class=\"why\">当前任务是 single-pick：每题从候选 peer 中选一个答案。拓扑关系天然是<b>二阶或集合级</b>信息：它回答“选了 p 以后，还要不要选 q”“p 和 q 的一致是否独立”“哪些 peer 组合覆盖最好”。如果最后只允许选一个 peer，<code>G[p,q]</code> 没有自然的 <code>chosen set</code>，强行做 <code>score(p) -= lambda sum_q G[p,q]</code> 会退化成一个全局 popularity / redundancy bias，容易和 <code>M_p</code> 的个人可靠性重复。</p><p class=\"why\" style=\"margin-top:6px\"><b>结论：</b>G 最应该影响的是 final aggregation / team assembly，而不是当前一选一 selector 的第一版。</p></div>",
    "type": "html"
  },
  {
    "html": "<h2>5. 最可能提升 final performance 的用法：拓扑感知聚合</h2><div class=\"card\"><p class=\"why\">把最后决策从“选最高分 peer”升级成“选若干 peer + 按拓扑去相关后聚合”。直觉：三个高度相似 peer 的一致票不能算三票；两个互补 cluster 的一致票才更强。</p><p style=\"text-align:center\"><code>confidence(answer) = topology_decorrelated_vote(answer, peer_scores, G)</code></p><p class=\"why\">实现上可以先做一个轻量版本：</p><ol class=\"why\"><li>先用 <code>M_p</code> 和 judge 得到每个 peer 的 individual utility。</li><li>按 utility 取 top-K 候选。</li><li>用 <code>G</code> 把同 cluster / 高冗余 peer 的权重打折，把互补或独立 peer 的一致性加权。</li><li>最终答案来自加权投票、verifier rerank，或 CM 对 top-K answers 的 synthesis。</li></ol><p class=\"why\" style=\"margin-top:6px\">这条路径最有涨分潜力，因为它直接利用了 <code>G</code> 的本质：peer 之间不是独立样本。</p></div>",
    "type": "html"
  },
  {
    "html": "<h2>6. 第二个有价值用法：graph-smoothed memory read</h2><div class=\"card\"><p class=\"why\">如果短期还不想改成 multi-pick，可以让 <code>G</code> 通过 topology smoothing 改善 cold-start 和样本效率。读 peer-p 的记忆时，不只读自己的 <code>M_p</code>，也从拓扑邻居借一点证据：</p><p style=\"text-align:center\"><code>steer_p(phi) = M_p phi + rho * sum_q A[p,q] M_q phi</code></p><p class=\"why\">其中 <code>A</code> 是从 <code>G</code> 归一化出来的 topology adjacency。含义是：如果 CM 已经知道 p 和 q 在拓扑上接近，那么 q 在相似 context 上累积的经验可以少量迁移给 p。这个对 train-3/eval-5 特别有用：新 peer 的 <code>M_p</code> 从 0 开始，但只要它很快和某个已有 cluster 形成边，就可以获得更快的有效记忆。</p><div class=\"callout clay\" style=\"margin-top:8px\"><span class=\"tag\">控制项</span><p class=\"why\" style=\"margin:6px 0 0\">这不能过强。<code>rho</code> 应该小，且只用高置信边；否则会把坏 clique 的偏见扩散到所有邻居。</p></div></div>",
    "type": "html"
  },

    "text": "这个思路好呀，无论是对我场景还是对于CM拆解任务的场景感觉都是一般化的设计。就是假如邻边独立，那就看各自的，假如拓扑相近，那就可以迁移，假如相互排斥还需要相互验证(不过也要避免CM从众）",

    "html": "<div class=\"answer\"><div class=\"callout rec\"><div class=\"callout-h\">是的，这个三态边解释更准确</div><p>可以把 <code>G</code> 从单纯的 joint correlation 升级成 CM 的 topology prior：边接近 0 时各看各的；正边表示相似/可迁移；负边表示排斥/互补/需要交叉验证。这样 <code>G</code> 不再是另一个 reliability score，而是告诉 CM 如何组合多个 peer 的证据。</p></div><div class=\"grid col-3\"><div class=\"card\"><h3>独立边</h3><p>当 <code>A[p,q]</code> 接近 0，读数保持本地化：主要用 <code>M_p phi</code>，不从邻居借太多信息。这是默认稳态，避免拓扑噪声污染单个 peer。</p></div><div class=\"card\"><h3>相近边</h3><p>当 CM 观察到两个 peer 在任务能力、答案空间或 reasoning 风格上稳定相近，可以做小权重迁移：<code>M_p phi + rho A[p,q] M_q phi</code>。这主要提升 cold-start 和低样本场景。</p></div><div class=\"card\"><h3>排斥边</h3><p>负边不要简单当作负迁移；更合适的语义是触发 verifier 或 disagreement check。也就是：它不一定说明 q 没用，而是说明 p 和 q 的冲突有信息价值。</p></div></div><div class=\"callout clay\"><div class=\"callout-h\">避免 CM 从众的关键</div><p>聚合时不能把相近 peer 的一致性当成独立多票。建议把正边用于去相关降权，把负边用于触发验证，而不是让高相似 cluster 直接放大置信度。简单规则是：同 cluster 多个 peer 同意，只算一份强证据；跨 cluster 同意，才提高置信度。</p></div></div>",
    "type": "html"
  },
  {
    "html": "<h2>7. G 的更新也应升级：从 oo^T 到拓扑边事件</h2><div class=\"card\"><p class=\"why\">当前 <code>G &lt;- gamma G + eta o o^T</code> 只能学 outcome correlation。若我们把 G 定义为 CM topology，它的 event signal 应该更丰富：</p><table><thead><tr><th>边信号</th><th>来源</th><th>表示什么</th></tr></thead><tbody><tr><td><code>s_p * s_q</code></td><td>judge quality / correctness</td><td>一起好或一起坏：能力相关性。</td></tr><tr><td><code>cos(h_answer_p, h_answer_q)</code></td><td>CM hidden answer embedding</td><td>内容 / 推理相似度：冗余。</td></tr><tr><td>disagreement + verifier result</td><td>答案冲突和最终验收</td><td>谁能校正谁：互补。</td></tr><tr><td>workflow transition</td><td>CM delegation trace</td><td>search -&gt; revise -&gt; patch 这类依赖边。</td></tr></tbody></table><p class=\"why\" style=\"margin-top:8px\">工程上建议先别把所有东西塞进一个标量边。更干净的是两通道：<code>G_sim</code> 表示 redundancy/similarity，<code>G_comp</code> 表示 complementarity/dependency。最后决策时分别用：sim 用来去重，comp 用来组队。</p></div>",
    "type": "html"
  },
  {
    "html": "<h2>8. 推荐路线</h2><table><thead><tr><th>阶段</th><th>改动</th><th>为什么</th></tr></thead><tbody><tr><td>Step 0</td><td>先跑完整 judge + block-phi sweep，并保留 ablate 对照。</td><td>确认主线 memory 本身是否真的带来 accuracy 增益。</td></tr><tr><td>Step 1</td><td>打开 <code>use_joint:on</code>，但只做诊断：保存/可视化 <code>G</code>，看是否形成稳定 cluster。</td><td>如果 G 没有结构，读它只会加噪声。</td></tr><tr><td>Step 2</td><td>实现 <code>topology_steer_vector = M_p phi + rho sum_q A[p,q] M_q phi</code>，作为 single-pick 最小接入。</td><td>低工程量，能测试 G 是否改善 cold-start / sample efficiency。</td></tr><tr><td>Step 3</td><td>把 final decision 改成 top-K + topology-decorrelated aggregation。</td><td>这是 G 的主战场，最可能提升最终性能。</td></tr><tr><td>Step 4</td><td>把 <code>G</code> 从单矩阵升级为 <code>G_sim/G_comp</code>，更新信号加入 answer similarity、disagreement、workflow transition。</td><td>从“正确性相关矩阵”升级为真正的 CM 拓扑图。</td></tr></tbody></table>",
    "type": "html"

  {
    "html": "<h2>9. 不建议现在做的事</h2><div class=\"card\"><ul class=\"why\"><li><b>不要只把 <code>redundancy_penalty(j, chosen)</code> 硬接到当前 single-pick selector。</b> 没有真正的 chosen set，语义会别扭，涨分概率低。</li><li><b>不要让 G 直接参与 judge 的梯度。</b> G 是 CM 的状态图，不是可训练参数；先保持 no_grad 写入更稳。</li><li><b>不要把 G 的 diagonal 当可靠性重复使用。</b> diagonal 和 <code>M_p</code> 的个人可靠性高度重叠；G 的价值在 off-diagonal topology。</li><li><b>不要过早上复杂 GNN。</b> 先用 graph-smoothed steer 和 topology-aware aggregation 验证信号存在，再决定是否值得引入更复杂 readout。</li></ul></div>",
    "type": "html"

    "html": "<h2>10. 一句话策略</h2><div class=\"callout olive\"><span class=\"tag\">proposal</span><p class=\"why\" style=\"margin:6px 0 0\">把 <code>M_p</code> 当作 peer 的个体长期能力记忆，把 <code>G</code> 当作 CM 的 peer topology。短期用 <code>G</code> 做 graph-smoothed memory read；中期把 final answer 改为 top-K + topology-decorrelated aggregation。这样 <code>G</code> 才会利用“peer 之间关系”这个性质，而不是退化成另一个个人分数。</p></div>",

    "html": "<div class=\"answer\"><div class=\"callout rec\"><div class=\"callout-h\">同意，先把 G 固定为 off</div><p>下一步应该先验证两件主线是否独立有效：<code>s_mode=judge</code> 代表 CM 自己评分是否能替代 oracle sign；<code>phi_mode=block</code> 代表 task 方向加 content block 是否比纯 task phi 更有用。这里先不接 G，避免把拓扑变量混进来导致归因不清。</p></div><div class=\"card\"><h3>推荐实验矩阵</h3><p>最小可判定组合是四个 arm，全部保持 <code>use_joint: off</code>：</p><ol><li><code>phi_mode=task, s_mode=oracle</code>：旧式上界/回归 sanity。</li><li><code>phi_mode=block, s_mode=oracle</code>：只测 block-phi 是否改善方向退化。</li><li><code>phi_mode=task, s_mode=judge</code>：只测 CM 自评分是否能在线驱动记忆。</li><li><code>phi_mode=block, s_mode=judge</code>：目标方案，验证两者叠加是否真实涨分。</li></ol><p>每个 arm 都需要配一个 <code>ablate_memory</code> 或 no-memory 对照，否则无法判断涨分来自 memory 还是 frozen CM 原始选择。</p></div><div class=\"card\"><h3>判定标准</h3><ul><li>如果 judge arm 接近 oracle arm，说明 CM 自评分路径可用。</li><li>如果 block 在 oracle 和 judge 下都优于 task，说明 phi 退化确实被缓解。</li><li>如果 <code>block + judge</code> 明显高于 ablate，才说明当前主线值得继续扩大训练。</li><li>如果 real 与 ablate 持平，先不要动 G，优先查 judge 输出是否塌缩、steerer gain 是否学起来、以及 fresh-event cache 是否只在极短 horizon 起作用。</li></ul></div><div class=\"callout clay\"><div class=\"callout-h\">暂时不做的事</div><p>这一轮不要把 <code>redundancy_penalty</code> 接进 selector，也不要打开 topology smoothing。G 的拓扑价值要等 <code>judge + block-phi</code> 主线跑出有效信号后再接，否则性能变化无法归因。</p></div></div>",
