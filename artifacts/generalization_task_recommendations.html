    "html": "<div class='eyebrow'>Generalization Suite</div><h1>除了 math / code / rag，推荐直接跑官方全量新任务</h1><p class='lede'>你的判断是对的：当前 <code>phi=proto</code> 不要求新任务有自己的 prototype，它会把新任务的 CM hidden 软寻址到已有的 math/code/rag centroid 上。这正好可以测试一种有价值的泛化：新任务如果自然落到旧能力方向附近，Sigma-Mem 的历史信任是否能迁移。</p><div class='callout rec'><div class='callout-h'>实验口径：benchmark 内部不抽样</div><p>推荐选择一组常见 benchmark，然后对每个 benchmark 的官方可标注 split 全量评估。只做必要的格式标准化和自动判分，不做人为采样、比例控制或难度重排。这样读者看到的是“zero-shot 到公开任务”的泛化，而不是你设计出的数据分布。</p></div>"

    "type": "html",
    "html": "<h2>1. 第一批：官方 split 全量跑</h2><div class='grid col-2'><div class='card'><h3>当前 core 主表</h3><p>建议主表先固定为 <b>BoolQ / ARC-Challenge / PIQA / WinoGrande / MMLU validation</b>。这五个已经能用同一套自动判分管线覆盖 yes-no、科学常识、多选、指代常识和广域知识。</p><p><b>为什么适合你：</b>任务形态足够分散，但接入方式统一，不需要额外规则 evaluator，也不会引入 LLM-as-judge。</p></div><div class='card'><h3>ARC-Challenge</h3><p><a href='https://allenai.org/open-data'>AI2 ARC</a> 是常见的 grade-school science 多选题；Challenge 子集特意避开浅层检索/词共现捷径。建议跑官方 labeled split 全量。</p><p><b>为什么适合你：</b>它是“知识 + 推理”的中间态，既不像纯 RAG 有显式长 context，也不像数学有形式符号。看它映射到 math 还是 rag，会很有解释力。</p></div><div class='card'><h3>PIQA</h3><p><a href='https://www.tensorflow.org/datasets/catalog/piqa'>PIQA</a> 是 physical commonsense，两选一，自动判分简单。建议跑官方 validation 全量。</p><p><b>为什么适合你：</b>它几乎不是 math/code/rag 中任何一个旧类，但又是很常用的 commonsense benchmark。若 Sigma 在这里也有 lift，说明 proto 迁移不是只在同类任务上工作。</p></div><div class='card'><h3>OpenBookQA</h3><p><a href='https://huggingface.co/datasets/allenai/openbookqa'>OpenBookQA</a> 是四选一小学科学题，dev/test 都只有约 500 条，题量小、自动判分清楚。</p><p><b>为什么适合你：</b>它和 ARC 同属科学常识，但更轻，适合作为 ARC 结果的复验，而不是增加太多生成成本。</p></div><div class='card'><h3>SciQ</h3><p><a href='https://huggingface.co/datasets/allenai/sciq'>SciQ</a> 是物理、化学、生物等科学考试多选题，validation/test 规模约千级，并带可选 support 段落。</p><p><b>为什么适合你：</b>如果不提供 support，它更像闭卷科学常识；如果提供 support，它更像轻量 RAG。两种口径可以做机制对照。</p></div><div class='card'><h3>HellaSwag / WinoGrande</h3><p><a href='https://rowanzellers.com/hellaswag/'>HellaSwag</a> 是 everyday event completion；<a href='https://huggingface.co/datasets/allenai/winogrande'>WinoGrande</a> 是二选一指代常识。建议如果纳入，就跑各自官方 validation 全量。</p><p><b>为什么适合你：</b>这类纯常识任务容易暴露“硬归类到旧 centroid 是否错误”。如果 φ 分布高熵但 lift 不高，说明需要 aspect prototype，而不是继续扩大旧三类。</p></div></div>"

    "html": "<h2>2. 第二批：谨慎加入或作为扩展</h2><div class='grid col-2'><div class='card'><h3>CommonsenseQA</h3><p><a href='https://aclanthology.org/N19-1421/'>CommonsenseQA</a> 是五选一常识问答，常用且容易接入。如果纳入，就跑官方 validation 全量。</p><p>它和 PIQA/ARC 有重叠；放在第二批只是为了控制主表数量，不是因为它不合适。</p></div><div class='card'><h3>SocialIQA</h3><p><a href='https://leaderboard.allenai.org/socialiqa/submissions/public'>SocialIQA</a> 是三选一社会常识推理，问题通常围绕人物意图、反应、后果。</p><p>它比 PIQA 更偏 social commonsense，和当前 math/code/rag 都不太同类，适合测试 φ 是否会高熵或错误靠近 rag。</p></div><div class='card'><h3>HellaSwag</h3><p><a href='https://rowanzellers.com/hellaswag/'>HellaSwag</a> 是四选一事件续写，validation 规模比 core 套件更大。它很常用，但生成量会明显增加。</p><p>建议作为扩展表：如果 core 套件已经有稳定 lift，再用 HellaSwag 验证 commonsense 方向是否一致。</p></div><div class='card'><h3>BBH</h3><p><a href='https://github.com/suzgunmirac/BIG-Bench-Hard'>BIG-Bench Hard</a> 是常用困难任务套件。当前不建议放主表，因为答案格式不一致，exact-match extractor 噪声较高。</p><p>它能测试“新任务落到 math-like reasoning 方向是否有帮助”。更适合作为机制诊断或附录，而不是当前主泛化表。</p></div></div>"

    "html": "<h2>4. 接入当前项目的实现建议</h2><div class='grid col-2'><div class='card'><h3>统一成 multiple-choice / boolqa</h3><p>大部分推荐任务都能统一成：</p><div class='code'><pre>record = {\n  \"id\": \"arc:...\",\n  \"task_type\": \"mcqa\",\n  \"problem\": question,\n  \"choices\": [\"...\", \"...\"],\n  \"choice_labels\": [\"A\", \"B\"],\n  \"answer\": \"B\",\n  \"source\": \"arc_challenge\"\n}</pre></div><p>peer 生成时要求最后输出 <code>Final answer: A/B/C/D</code>；grader 只抽最后一个选项字母。这样 ARC、MMLU、HellaSwag、CommonsenseQA、OpenBookQA、SciQ、SocialIQA 都能共用。</p></div><div class='card'><h3>当前先不接规则型/脚本型任务</h3><p>主表先只放现有自动判分稳定的 MCQA / yes-no 任务。需要额外 evaluator、dataset script 或 LLM-as-judge 的任务先不要混入主表。</p><p>这样主结论更干净：读者看到的是同一套 peer generation、同一套 extraction、同一套 <code>peer_correct</code> 逻辑下的泛化结果。</p></div></div>"
