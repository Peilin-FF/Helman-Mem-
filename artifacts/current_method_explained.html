    "html": "<h1>Online-Feedback Peer Selector&nbsp;</h1>\n<p style=\"font-size:1.05em\">A frozen <b>Center Model (CM)</b> reads a question together with the answers of three\npeer models and picks the most trustworthy one. The research contribution is <b>online feedback</b>:\nafter the CM commits to a pick, the ground-truth correctness of every peer is written into a small,\nper-peer <b>memory state <code>S</code></b> that is carried forward to the next question — so the\nselector keeps adapting <i>at test time</i>, with the backbone never updated.</p>\n<div class=\"callout clay\"><span class=\"tag\">what this document covers</span>\n<p class=\"why\" style=\"margin:6px 0 0\">Read top to bottom it builds, from first principles:\n(1) the task and why the CM is frozen; (2) the Delta-Mem memory mechanism and its read/write maths;\n(3) how selection is scored; (4) <b>Approach #8</b> — anonymous selection + a learned trust-head;\n(5) the <b>write-gradient bug</b> we found and fixed; (6) <b>Algorithm B</b> (single memory) and\n(7) <b>Algorithm A</b> (dual memory + gate); (8) results and the key scientific finding.</p></div>",
    "type": "html"
  },
  {
    "html": "<h2>1. The task — \"Setting A\" answer-level selection</h2>\n<div class=\"flex\" style=\"gap:16px\">\n<div class=\"card\" style=\"flex:1.2\">\n<h3 style=\"margin-top:0\">The pipeline</h3>\n<ul class=\"why\" style=\"margin:4px 0 0\">\n<li>Three fixed <b>peer models</b> each answer the question in full:\n<code>gemma-3-4b-it</code>, <code>Phi-4-mini</code>, <code>Qwen2.5-Coder-7B</code></li>\n<li>The <b>Center Model</b> (Qwen3-0.6B / 4B / 8B) is given the question + all three full answers\nin one prompt and must output <i>which peer to trust</i> — \"Peer 0\", \"Peer 1\", or \"Peer 2\".</li>\n<li>The CM's <b>backbone weights are frozen</b>. It never learns to <i>solve</i> the task; it only\nlearns to <i>route trust</i>. This isolates the research question: can a tiny adaptive memory learn\n<i>who to trust</i> without retraining the model?</li>\n</ul>\n<p class=\"why\" style=\"margin-top:6px\"><b>\"Setting A\"</b> = answer-level selection: the unit of choice is each peer's\n<i>complete final answer</i> (K-choose-1). (An older \"Setting B\" did step-level selection; it is not\npart of the current line.)</p>\n</div>\n<div class=\"card\" style=\"flex:1;background:#F2F0E9\">\n<h3 style=\"margin-top:0\">Why frozen + memory?</h3>\n<p class=\"why\">If we fine-tuned the CM we could not tell whether gains come from <i>better reasoning</i>\nor <i>better trust-tracking</i>. Freezing the backbone and letting <b>only a rank-8 memory</b> adapt\nmeans any test-time improvement must come from the accumulated feedback — a clean measurement\nof the online-feedback idea.</p>\n</div>\n</div>",
    "type": "html"
  },
  {
    "html": "<h2>2. The memory mechanism (Delta-Mem)</h2>\n<div class=\"card\"><p class=\"why\">Inside the upper-half attention layers of the CM we attach a small\n<b>online memory</b>: a rank-<i>r</i> matrix <code>S ∈ ℝ<sup>r×r</sup></code> (here r=8) per\nsteered layer. It is touched in two ways at every token, by two <b>disjoint</b> sets of trainable\nprojections (the backbone stays frozen):</p></div>\n<div class=\"flex\" style=\"gap:16px;margin-top:10px\">\n<div class=\"card\" style=\"flex:1;border-left:4px solid #788C5D\">\n<h3 style=\"margin-top:0\">READ — steer attention from memory</h3>\n<p class=\"why\">Query the memory with the current hidden state <code>h</code>, get a rank-<i>r</i>\nread vector, and use it to <b>nudge</b> the frozen attention's q/k/v:</p>\n<div class=\"code\"><pre>reads = S · (memory_q_proj · h)        # ℝ^r\nq = q_base + delta_q_proj · reads\nk = k_base + delta_k_proj · reads\nv = v_base + delta_v_proj · reads\no = o_base + delta_o_proj · reads</pre></div>\n<p class=\"why\" style=\"margin-top:6px\">Projections: <code>memory_q_proj</code>, <code>delta_q/k/v/o_proj</code>.\nThey decide <b>how the memory bends the model's attention</b>.</p>\n</div>\n<div class=\"card\" style=\"flex:1;border-left:4px solid #D97757\">\n<h3 style=\"margin-top:0\">WRITE — update memory (delta rule)</h3>\n<p class=\"why\">After reading, optionally write the token into <code>S</code> with a gated\ndelta (Hebbian-style) update:</p>\n<div class=\"code\"><pre>k_m = memory_k_proj · h\nv_m = memory_v_proj · h\nβ   = σ(beta_proj · h)            # write strength\nS   = S + β · (v_m − S·k_m) · k_mᵀ</pre></div>\n<p class=\"why\" style=\"margin-top:6px\">Projections: <code>memory_k_proj</code>, <code>memory_v_proj</code>,\n<code>beta_proj</code>. They decide <b>WHAT gets stored</b> in memory. <b>These are the projections at\nthe centre of the bug in §5.</b></p>\n</div>\n</div>\n<div class=\"callout olive\" style=\"margin-top:10px\"><span class=\"tag\">key idea</span>\n<p class=\"why\" style=\"margin:6px 0 0\">READ projections turn \"what is in memory\" into a steering signal;\nWRITE projections turn \"what just happened\" into a memory update. Selection uses READ; feedback uses\nWRITE. A working method needs <b>both</b> trained.</p></div>",
    "type": "html"
  },

    "html": "<h2>3. How a pick is made (autoregressive scoring)</h2>\n<div class=\"card\"><p class=\"why\">There is no classification head. The CM scores each candidate\ncontinuation by its language-model log-probability and takes the argmax:</p>\n<div class=\"code\"><pre>prompt = Question + [peer 0 answer] + [peer 1 answer] + [peer 2 answer] + \"Answer:\"\nfor j in 0..P-1:\n    score[j] = Σ<sub>tokens</sub> logP( \" Peer j\" | prompt , memory S )   # teacher-forced\nselected = argmax<sub>j</sub> score[j]</pre></div>\n<p class=\"why\" style=\"margin-top:6px\">Because the read path (§2) injects <code>S</code> into every steered\nlayer, the <b>memory shifts these log-probabilities</b> — that is the only channel through which\naccumulated trust can change the decision. Training supervises the gold \"Peer k\" token with\ncross-entropy; argmax is used only at eval.</p></div>",
    "type": "html"
  },
  {
    "html": "<h2>4. Approach&nbsp;#8 — anonymous selection + a trust-head</h2>\n<p class=\"why\">#8 was our previous best feedback design. Two ideas:</p>\n<div class=\"flex\" style=\"gap:16px\">\n<div class=\"card\" style=\"flex:1\">\n<h3 style=\"margin-top:0\">(a) Anonymous selection</h3>\n<p class=\"why\">The selection prompt carries <b>no model names</b> — peers appear only as\n\"Peer 0/1/2\" in a per-example random order. This stops the CM from learning a fixed content prior\n(\"gemma is usually right\"), which would be a shortcut that ignores the actual answers.</p>\n</div>\n<div class=\"card\" style=\"flex:1\">\n<h3 style=\"margin-top:0\">(b) Identity only as a routing address</h3>\n<p class=\"why\">Each <i>real</i> peer has its <b>own memory state</b> <code>S<sub>peer</sub></code>.\nIdentity is used only to decide <i>which</i> state to read/write — never shown in the prompt. So\ntrust accrues per real peer, but the selection itself stays content-driven.</p>\n</div>\n</div>\n<div class=\"card\" style=\"margin-top:10px\"><h3 style=\"margin-top:0\">The trust-head</h3>\n<p class=\"why\">A tiny MLP reads a peer's accumulated state and emits one scalar <b>trust bias</b> added to\nthat peer's selection log-prob:</p>\n<div class=\"code\"><pre>trust_bias(peer s) = MLP( flatten(S<sub>s</sub>) )      # ℝ → 64 → tanh → 1\nscore[s] = logP(\" Peer s\" | prompt) + trust_bias(s)</pre></div>\n<p class=\"why\" style=\"margin-top:6px\">Crucially the bias is read from the <b>accumulated state via a constant query</b>\n(it depends only on <code>S<sub>s</sub></code>, not on the current answer text), so swapping answer\ncontent cannot scramble it. <b>Train:</b> score each \" Peer s\" with peer-s's own state + bias, CE to the\ngold slot. <b>Eval (feedback arm):</b> per item, score read-only → argmax → write each peer's\ncorrect/incorrect into its own state → carry forward.</p></div>\n<div class=\"callout olive\" style=\"margin-top:8px\"><span class=\"tag\">result</span>\n<p class=\"why\" style=\"margin:6px 0 0\">First clean net-positive feedback result in the anonymous setting:\n<b>0.6B 65.0, 4B +1.2, 8B +0.7</b> over pure-anon, gain rising with stream stability, no collapse.\nA \"safe but small\" win — and §8 explains <i>why</i> it was so safe.</p></div>",
    "type": "html"
  },

    "html": "<h2>5. The write-gradient bug (and the fix)</h2>\n<div class=\"card\" style=\"border-left:4px solid #D97757\"><p class=\"why\">While building Algorithms A &amp; B\nwe found that the <b>WRITE projections</b> (<code>memory_k_proj</code>, <code>memory_v_proj</code>,\n<code>beta_proj</code>) received <b>exactly zero gradient</b> during training. The CM learned to READ\nits memory but never learned <i>WHAT to write</i> into it — the feedback channel was effectively\ninert. There were two independent blockers, and <b>both</b> had to be fixed.</p>\n<table style=\"width:100%;border-collapse:collapse;margin-top:8px;font-size:0.93em\">\n<tbody><tr style=\"border-bottom:1.5px solid #D1CFC5\"><th style=\"text-align:left;padding:6px\">Blocker</th><th style=\"text-align:left;padding:6px\">Why it kills the gradient</th><th style=\"text-align:left;padding:6px\">Fix</th></tr>\n<tr style=\"border-bottom:1px solid #E8E6DE\"><td style=\"padding:6px\"><b>(a) detached write pass</b></td><td style=\"padding:6px\">the write ran under <code>@torch.no_grad()</code> and ended with <code>detach_state()</code> — either alone severs the graph.</td><td style=\"padding:6px\">a differentiable <code>write_pass_grad</code> (no no_grad, no detach).</td></tr>\n<tr><td style=\"padding:6px\"><b>(b) zero-init deadlock</b> <span style=\"color:#D97757\">(the deep one)</span></td><td style=\"padding:6px\">delta projections init to <b>zero</b> ⇒ reads have a <b>zero output-Jacobian</b> ⇒ <code>∂loss/∂reads = 0</code>, which blocks gradient back to the write projections even when they ARE wired into the graph.</td><td style=\"padding:6px\"><code>delta_output_init: random</code> (scaled by 0.05, so step-0 ≈ frozen base but the Jacobian is non-zero).</td></tr>\n</tbody></table>\n<p class=\"why\" style=\"margin-top:8px\"><b>Proof by autograd bisection:</b>\n<code>∂loss/∂memory_k</code> = <b>0.0</b> with zero-init → <b>4.4</b> with small-random init.\nAfter both fixes the WRITE-projection gradient norm went from <b>0 → ~1.5e3</b>. (Caveat:\ngradient-checkpointing re-introduces blocker (a), so it must stay off for these runs.)</p></div>",
    "type": "html"
  },

    "html": "<div class=\"card\"><h3 style=\"margin-top:0\">How A &amp; B route the gradient into the write projections</h3>\n<svg viewBox=\"0 0 720 250\" width=\"100%\" style=\"max-width:720px;font-family:system-ui\">\n  <text x=\"20\" y=\"18\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#141413\">Broken: zero-init Δ → reads have zero output-Jacobian → write proj get no grad</text>\n  <rect x=\"20\" y=\"30\" width=\"120\" height=\"38\" rx=\"7\" fill=\"#fff\" stroke=\"#D97757\" stroke-width=\"2\"></rect>\n  <text x=\"80\" y=\"52\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#D97757\">write proj</text>\n  <text x=\"146\" y=\"51\" font-size=\"13\" fill=\"#D97757\">✖</text>\n  <rect x=\"168\" y=\"30\" width=\"95\" height=\"38\" rx=\"7\" fill=\"#F2F0E9\" stroke=\"#9a988f\"></rect>\n  <text x=\"215\" y=\"52\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#3D3D3A\">S → reads</text>\n  <rect x=\"288\" y=\"30\" width=\"120\" height=\"38\" rx=\"7\" fill=\"#F2F0E9\" stroke=\"#9a988f\"></rect>\n  <text x=\"348\" y=\"47\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#9a988f\">Δ=0·reads=0</text>\n  <text x=\"348\" y=\"60\" font-size=\"8\" text-anchor=\"middle\" fill=\"#9a988f\">(zero Jacobian)</text>\n  <rect x=\"430\" y=\"30\" width=\"80\" height=\"38\" rx=\"7\" fill=\"#141413\"></rect>\n  <text x=\"470\" y=\"52\" font-size=\"10\" text-anchor=\"middle\" fill=\"#fff\">loss</text>\n  <path d=\"M 430 88 Q 290 110 290 70\" fill=\"none\" stroke=\"#9a988f\" stroke-width=\"2\"></path>\n  <text x=\"300\" y=\"105\" font-size=\"9\" fill=\"#9a988f\">grad stops at reads — never reaches write proj</text>\n\n  <text x=\"20\" y=\"150\" font-size=\"12.5\" font-weight=\"bold\" fill=\"#141413\">Fixed (A &amp; B): random Δ-init + content write feeds the SAME selection loss</text>\n  <rect x=\"20\" y=\"162\" width=\"120\" height=\"38\" rx=\"7\" fill=\"#fff\" stroke=\"#788C5D\" stroke-width=\"2\"></rect>\n  <text x=\"80\" y=\"180\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#788C5D\">write proj</text>\n  <text x=\"80\" y=\"193\" font-size=\"8\" text-anchor=\"middle\" fill=\"#6b6a64\">memory_k/v, β</text>\n  <text x=\"146\" y=\"184\" font-size=\"13\" fill=\"#788C5D\">→</text>\n  <rect x=\"168\" y=\"162\" width=\"120\" height=\"38\" rx=\"7\" fill=\"#F2F5EE\" stroke=\"#788C5D\"></rect>\n  <text x=\"228\" y=\"180\" font-size=\"9\" text-anchor=\"middle\" fill=\"#3D3D3A\">content write</text>\n  <text x=\"228\" y=\"193\" font-size=\"8\" text-anchor=\"middle\" fill=\"#6b6a64\">→ S (in-graph)</text>\n  <text x=\"294\" y=\"184\" font-size=\"13\" fill=\"#788C5D\">→</text>\n  <rect x=\"316\" y=\"162\" width=\"120\" height=\"38\" rx=\"7\" fill=\"#fff\" stroke=\"#788C5D\" stroke-width=\"2\"></rect>\n  <text x=\"376\" y=\"180\" font-size=\"9\" text-anchor=\"middle\" fill=\"#3D3D3A\">read S → steer</text>\n  <text x=\"376\" y=\"193\" font-size=\"8\" text-anchor=\"middle\" fill=\"#6b6a64\">Δ≠0 now</text>\n  <text x=\"442\" y=\"184\" font-size=\"13\" fill=\"#788C5D\">→</text>\n  <rect x=\"464\" y=\"162\" width=\"80\" height=\"38\" rx=\"7\" fill=\"#141413\"></rect>\n  <text x=\"504\" y=\"184\" font-size=\"10\" text-anchor=\"middle\" fill=\"#fff\">CE loss</text>\n  <path d=\"M 504 218 Q 260 240 80 202\" fill=\"none\" stroke=\"#788C5D\" stroke-width=\"2\"></path>\n  <text x=\"250\" y=\"238\" font-size=\"9\" fill=\"#788C5D\">grad flows back to write proj → learns WHAT to write</text>\n</svg>\n<p class=\"why\" style=\"margin-top:6px\">The shared trick of both algorithms: make the <b>content write part of the\nselection forward</b> (write ON, grad ON). The selection CE loss then backpropagates <i>through</i> the\nwrite projections, so they finally learn. The two algorithms differ only in how they keep\n<i>content</i> memory separate from <i>persistent trust</i> memory.</p></div>",
    "type": "html"

    "html": "<h2>6. Algorithm B — one shared memory, snapshot / rollback</h2>\n<div class=\"card\"><p class=\"why\">Simplest design: <b>one</b> state <code>S</code> holds both this item's\ncontent and the accumulated trust. A snapshot keeps the trust part clean.</p>\n<h3 style=\"margin-top:6px\">Training (per item, stream in order, batch = 1)</h3>\n<div class=\"code\"><pre>S_keep = clone(S).detach()                 # 1. snapshot the persistent feedback memory\n# Write-1 (content → S), write ON, grad ON:\nwrite the bare prompt prefix into S\nscore every \" Peer s\" read-only against S\nloss = CE(scores, gold)                     # ← trains BOTH read and write proj\nloss.backward()                             #    (write proj via the content→target path)\nS = S_keep                                  # 2. rollback: discard THIS item's content\n# Write-2 (feedback → S), grad OFF:\nwrite \"Peer j: correct/incorrect\" into S    # 3. trust update, persists\ndetach(S)                                   #    carry to next item; never hard-reset</pre></div>\n<p class=\"why\" style=\"margin-top:6px\">Because Write-1 is inside the loss graph, the write projections train\n\"<b>for free</b>\" — so Write-2 can be grad-OFF. The snapshot/rollback guarantees the persistent\nstate is a <i>pure feedback memory</i>: the current item's content is read during selection but never\nallowed to pollute what carries forward.</p>\n<p class=\"why\" style=\"margin-top:4px\"><span class=\"tag\">engineering note</span> backward is called <b>per item</b>\n(not accumulated across the window) — accumulating four 8k-token forward graphs blew up GPU memory.\nGradients still accumulate in <code>.grad</code>; the optimizer steps at the grad-accum boundary.</p>\n<h3 style=\"margin-top:8px\">Eval (the \"B.5\" protocol — mirrors training exactly)</h3>\n<p class=\"why\">snapshot → content write → score read-only → argmax → rollback →\n(online arm only) feedback write. Matching the train and eval write/read order was essential — a\nmismatched eval gave wrong accuracies until aligned.</p></div>",
    "type": "html"
  },
  {
    "html": "<h2>7. Algorithm A — two memories (content + trust) + a fusion gate</h2>\n<div class=\"card\"><p class=\"why\">Cleaner separation: <b>two</b> physical states. <code>C</code> = content,\nreset every item; <code>F</code> = trust, persistent. A learnable gate fuses their reads before steering.</p>\n<h3 style=\"margin-top:6px\">Training (per item)</h3>\n<div class=\"code\"><pre>C = fresh (reset each item)\n# Write-1 (content → C), write ON, grad ON:\nwrite the bare prefix into C\n# Score against the BLEND  M = λ·C + (1−λ)·F   ,  λ = σ(gate_logit), trainable\nscore every \" Peer s\" with M    (C kept in-graph; F detached)\nloss = CE(scores, gold) ; loss.backward()\n# Write-2 (feedback → F), persistent across items\nwrite \"Peer j: correct/incorrect\" into F</pre></div>\n<p class=\"why\" style=\"margin-top:6px\">Since reads are linear in the state, blending the states and then reading\nequals the spec's per-read fusion under a scalar gate. The write projections train via the\ncontent→C→loss path (same trick as B); <code>F</code>'s write is meant to train through\ntruncated BPTT across the grad-accum window (detach <code>F</code> only at the window edge). The gate\n<code>λ</code> is a diagnostic: λ→1 means \"ignore trust\", λ→0 means\n\"lean on trust\".</p>\n<h3 style=\"margin-top:8px\">Eval</h3>\n<p class=\"why\">content → fresh C ; score against blend(C, F) → argmax ; feedback → F (persists).</p></div>\n<div class=\"callout\" style=\"margin-top:8px;border-left:4px solid #6b6a64\"><span class=\"tag\">A vs B in one line</span>\n<p class=\"why\" style=\"margin:6px 0 0\"><b>B</b>: one state, content written on top of trust then rolled back —\nfewer params, simpler. <b>A</b>: two states read separately and gate-fused — more params, cleaner\nseparation, plus a readable gate. Everything else (data, tokenization, layers, rank, optimizer, stream\norder) is identical so they are directly comparable.</p></div>",
    "type": "html"
  },
  {
    "html": "<div class=\"callout clay\">\n<span class=\"tag\">honest note — how the implementation deviates from the Bug_fix.md spec</span>\n<p class=\"why\" style=\"margin:6px 0 0\">Two deviations in the actual code (<code>train_feedback_algo.py</code>),\nboth forced by an out-of-memory constraint. They matter most for <b>Algorithm A</b>.</p>\n<div class=\"flex\" style=\"gap:16px;margin-top:8px\">\n<div class=\"card\" style=\"flex:1\">\n<h3 style=\"margin-top:0\">B's Write&nbsp;2 — matches spec ✓</h3>\n<p class=\"why\">Spec B.4 says Write&nbsp;2 (feedback → S) is <b>grad&nbsp;OFF</b>; the write projections are\nalready trained by the Write&nbsp;1 content→target path. The code does exactly this\n(<code>model.write_pass(...)</code>, no-grad + detach). So <b>B is faithful</b>.</p>\n</div>\n<div class=\"card\" style=\"flex:1;border-left:4px solid #D97757\">\n<h3 style=\"margin-top:0\">A's Write&nbsp;2 — deviates ✗</h3>\n<p class=\"why\">Spec A.4 requires A's Write&nbsp;2 (feedback → F) to be <b>grad&nbsp;ON</b>: F stays in the\ngraph, is read by the <i>next</i> examples' selections, and is detached only at the grad-accum boundary —\ni.e. <b>F's write projections are trained by truncated BPTT</b>. That is the whole selling point of A. The code\ninstead wraps Write&nbsp;2 in <code>torch.no_grad()</code> (<b>grad OFF</b>).</p>\n</div>\n</div>\n<p class=\"why\" style=\"margin-top:10px\"><b>Why the deviation.</b> Training was switched to <b>per-example backward</b> to\nbound memory (accumulating four 8k-token forward graphs across the grad-accum window OOM'd). Once backward is\nper-example, \"keep F in-graph across examples for BPTT\" is impossible (it would double-backward), so Write&nbsp;2\nbecame grad-OFF. This was paired with a <b>second simplification</b>: A is implemented with <b>one shared set of\nwrite projections + a single scalar gate</b> (state-level blend $M=\\lambda C+(1-\\lambda)F$), not the spec's\n<b>two independent C/F projection sets + a per-layer vector gate</b> <code>W_g</code>.</p>\n<p class=\"why\" style=\"margin-top:6px\"><b>Consequence.</b> Because the write projections are shared and trained only\nthrough the content→C path, F's write learns \"<i>how to write content</i>\" but is <b>never optimized by the\nloss for \"given this correctness, what trust should I write\"</b>. This is consistent with what we observed: A's\ngate stays stuck at $\\lambda\\approx0.5$ (gate gradient too weak to move) and trust still collapses under CF. In\nother words, <b>the BPTT-trained-trust mechanism that is A's core contribution was not actually realized</b>. A\nspec-faithful A would need window-accumulated backward (or gradient checkpointing for memory) + Write&nbsp;2\ngrad-ON + separate C/F projections — not yet run.</p>\n</div>",
    "type": "html"
  },

    "html": "<h2>9. Reset-policy ablation — does cross-example memory help?</h2>\n<div class=\"card\"><p class=\"why\">0.6B Center Model, unified counterfactual (CF) streams, online-feedback arm,\n<b>cold start</b> (persistent memory begins at zero; trained <code>trust_state.pt</code> is NOT loaded,\nso all test-time trust is accrued from the test stream itself). A <b>CF stream</b> controls how stable\npeer reliability is: <b>CF@0</b> = peer strength fully shuffled (history is meaningless),\n<b>CF@90</b> = reliability stable (history should extrapolate).</p>\n<p class=\"why\" style=\"margin-top:6px\">Two reset policies are compared per algorithm:</p>\n<ul class=\"why\" style=\"margin:4px 0 0\">\n<li><b>accumulate</b> — the persistent memory is carried across the whole stream (reset only once,\nat the start). For <b>B</b> the single state <code>S</code> persists; for <b>A</b> only <code>C</code>\nresets each item while the trust state <code>F</code> persists.</li>\n<li><b>reset / ex</b> — the persistent memory is wiped before <b>every</b> example, so each question\nis judged independently with no cross-example memory. For <b>B</b>, <code>S</code> is reset each item;\nfor <b>A</b>, both <code>C</code> and <code>F</code> are reset.</li>\n</ul>\n<p class=\"why\" style=\"margin-top:6px\">If online feedback genuinely helps, <b>accumulate</b> should beat\n<b>reset/ex</b> — especially at CF@90 where history is reliable.</p></div>",

    "html": "<div class=\"callout clay\"><span class=\"tag\">what the comparison shows</span>\n<p class=\"why\" style=\"margin:6px 0 0\"><b>Algorithm B is identical under both policies</b> (54.0 vs 54.0, bit-for-bit).\nReason: B writes the full ~800-token content prefix onto <code>S</code> <i>before</i> scoring, and with the\nper-token retention keep≈0.982 the content write decays any accumulated feedback by\n0.982<sup>~800</sup>≈10<sup>−7</sup> — so by the time candidates are scored the persistent\nmemory has been <b>overwritten by the current item's content</b>, regardless of reset policy. B's \"online\nfeedback\" therefore does essentially nothing at selection time; its accuracy is a pure content-steering effect.</p></div>\n<div class=\"callout clay\" style=\"margin-top:10px\"><span class=\"tag\">Algorithm A</span>\n<p class=\"why\" style=\"margin:6px 0 0\"><b>A does respond to the policy</b>: accumulate 54.1 vs reset/ex 51.6 (mean).\nBecause A keeps trust in a <i>physically separate</i> state <code>F</code> that the content write never touches,\naccumulated feedback survives to selection. But the help is <b>inverted</b> by CF: accumulate beats reset only\nat CF@50–90 (e.g. CF@90 48.0 vs 43.6), while at CF@0 reset is actually <i>better</i> (64.6 vs 63.5) —\nwhen history is meaningless, remembering it hurts. Net: cross-example memory helps only when reliability is stable,\nexactly the regime CF is designed to remove.</p></div>\n<div class=\"callout olive\" style=\"margin-top:10px\"><span class=\"tag\">core conclusion</span>\n<p class=\"why\" style=\"margin:6px 0 0\">The ablation cleanly separates the two designs. <b>B</b> cannot exploit cross-example\nmemory at all (content overwrites trust each step) — its single shared state is the architectural flaw.\n<b>A</b> can, but the benefit is a stability-dependent +2.4 mean that <i>collapses</i> exactly where CF makes\nhistory misleading. This confirms the headline finding: the online-feedback idea genuinely helps only on stable\nstreams, and the dual-state separation (A) is what's needed to access that benefit at all.</p></div>",

    "html": "<h2>10. Write-projection ablation — does the write mechanism help at all?</h2>\n<div class=\"card\"><p class=\"why\">The reset ablation (§9) showed cross-example memory barely matters. This goes\nfurther: <b>turn the write mechanism completely OFF</b>. With <code>--ablate_write</code> both the content\nwrite and the feedback write are skipped, so the state <code>S</code> never leaves its initial value. Combined\nwith <b>cold start</b> (S = 0), the read becomes $\\text{reads}=S\\cdot q(h)=0$ — <b>zero steering</b>, i.e.\nthe frozen backbone selecting on the bare anonymous prompt, with the trained projections present but inert.</p>\n<p class=\"why\" style=\"margin-top:6px\"><b>Sanity check passed:</b> with writes off and S = 0, Algorithm A and\nAlgorithm B give <b>bit-identical</b> accuracy at every CF level (their only difference is how memory is\norganized, and here memory contributes nothing) — confirming this is a clean zero-steering baseline.\nThe single \"NO-WRITE\" row below is therefore shared by both.</p></div>",

    "html": "<div class=\"callout olive\"><span class=\"tag\">answer: yes — NO-WRITE = cold start (no trS) + writes off, both together</span></div>\n<div class=\"card\" style=\"margin-top:8px\">\n<p class=\"why\">Correct, and it is the combination of <b>two independent switches</b>\n(<code>--init_state cold --ablate_write</code>). Either one alone is <i>not</i> the zero-steering baseline:</p>\n<table style=\"width:100%;border-collapse:collapse;margin-top:6px;font-size:0.92em\">\n<tbody><tr style=\"border-bottom:1.5px solid #D1CFC5\"><th style=\"text-align:left;padding:6px\">switch</th><th style=\"text-align:left;padding:6px\">what it controls</th><th style=\"text-align:left;padding:6px\">effect on the state S</th></tr>\n<tr style=\"border-bottom:1px solid #E8E6DE\"><td style=\"padding:6px\"><code>init_state = cold</code></td><td style=\"padding:6px\">the <b>starting value</b> of S at the first example</td><td style=\"padding:6px\">S begins at <b>0</b> — the trained <code>trS</code> (trust_state.pt) is <b>NOT</b> loaded. (warm would load it.)</td></tr>\n<tr><td style=\"padding:6px\"><code>ablate_write</code></td><td style=\"padding:6px\">whether <b>either</b> write pass runs</td><td style=\"padding:6px\">skips <b>both</b> writes — the content write <i>and</i> the feedback write — so S <b>never changes</b> from its start value.</td></tr>\n</tbody></table>\n<p class=\"why\" style=\"margin-top:8px\">Cold makes the start = 0; ablate_write keeps it 0 forever. Together: S ≡ 0 for the\nwhole stream ⇒ reads = S·q(h) = 0 ⇒ <b>zero steering</b> = the frozen backbone selecting on the bare\nanonymous prompt (the trained delta projections are present but inert).</p>\n<p class=\"why\" style=\"margin-top:6px\"><b>Why both are needed — and why it is different from the earlier trS ablation.</b>\nEarlier we ablated <code>trS</code> alone (cold start, but writes still ON): that left the write/steer mechanism\nrunning, it just re-accrued S from the test stream — and accuracy was unchanged, which told us the training-set\nbias does not live in <code>trS</code>. This NO-WRITE row goes further by also turning the writes OFF, so the\nmechanism contributes nothing at all. So they are <b>not</b> the same experiment: trS-ablation = \"don't start from\ntrained memory\"; NO-WRITE = \"don't start from trained memory <i>and</i> never write\" = pure frozen backbone.</p>\n<div class=\"callout clay\" style=\"margin-top:10px\"><span class=\"tag\">two writes, not just feedback</span>\n<p class=\"why\" style=\"margin:6px 0 0\">Worth being precise: “don’t write” means <b>both</b> write\npasses are off, not only the feedback one. Per example there are two:</p>\n<ul class=\"why\" style=\"margin:4px 0 0\">\n<li><b>content write</b> — before scoring, the prompt itself (question + the three peer answers) is written\ninto S. For Algorithm&nbsp;B this is the <i>main</i> steering source at selection time.</li>\n<li><b>feedback write</b> — after the pick, each peer’s correct/incorrect label is written into S (the\n“online feedback” proper).</li>\n</ul>\n<p class=\"why\" style=\"margin-top:6px\">Turning off <b>only</b> the feedback write would still leave the content write\nrunning — S would be rewritten by the current item every step, reads ≠ 0, so it would <b>not</b> be zero\nsteering. NO-WRITE switches off both (and cold makes the start 0), which is the only way to guarantee S ≡ 0\nfor the whole stream ⇒ truly inert memory.</p></div>\n</div>",

    "html": "<div class=\"callout clay\"><span class=\"tag\">the write mechanism is the cause of the CF collapse</span>\n<p class=\"why\" style=\"margin:6px 0 0\">The zero-steering frozen backbone has the <b>opposite</b> CF profile to the\nwritten models: it <i>rises</i> with stability (51.0 → 63.2) instead of collapsing. Turning writing ON\n<b>adds accuracy only at CF@0</b> (B +16.5, A +12.6) but <b>actively destroys it as reliability becomes stable</b>\n(CF@90: B −17.8, A −15.2). So the inverted-U collapse seen in §9 is produced <b>entirely by the\nwrite/steer mechanism</b> — the backbone alone is robust across all CF levels.</p></div>\n<div class=\"callout olive\" style=\"margin-top:10px\"><span class=\"tag\">core conclusion</span>\n<p class=\"why\" style=\"margin:6px 0 0\">Stacking the three ablations tells one story. (1) Removing the trained state\n<code>trS</code> changed nothing — the training-set bias does not live in the saved memory. (2) Resetting\ncross-example memory changed almost nothing — B is reset-invariant, A barely moves. (3) Removing the write\nprojections entirely makes the model <b>better on average</b> (57.9 vs ~54) and removes the CF collapse. Taken\ntogether: on these counterfactual streams the learned write/steer mechanism is <b>net harmful</b> — it\noverfits a content/position cue that pays off only when peer roles match training (CF@0) and misleads once roles\nshift. The honest baseline to beat is the frozen backbone itself.</p></div>",

    "html": "<h2>10b. Who actually does the work? — decomposing the write into content-steer vs feedback</h2>\n<div class=\"card\"><p class=\"why\">The puzzle: after the write-bug fix the model beats prompt-only, yet dropping <code>trS</code>\nchanged nothing and resetting cross-example memory changed nothing. So <b>what</b> produces the gain? There are\nthree nested levels of \"using memory\", and we can turn them on one at a time (0.6B, cold, CF streams):</p>\n<ul class=\"why\" style=\"margin:4px 0 0\">\n<li><b>NO-WRITE</b> — S≡0, zero steering (frozen backbone).</li>\n<li><b>read-only</b> — the <i>content write</i> runs (this example's prompt is written into S, then read back\nthrough the trained read projections to steer selection), but <b>no feedback write</b> — nothing carries to\nthe next example.</li>\n<li><b>online</b> — content write <i>and</i> the per-peer correct/incorrect feedback write that persists across examples.</li>\n</ul></div>",

    "html": "<div class=\"callout clay\"><span class=\"tag\">the answer: it is the within-example content write, NOT feedback</span>\n<p class=\"why\" style=\"margin:6px 0 0\">Compare the rows. <b>read-only ≈ online</b> almost exactly — for B the\nfeedback write moves accuracy by <b>0.0–0.3 points</b> at every CF level (online−read-only =\n[0.0, +0.3, 0.0, +0.1]). So the “online feedback” that is supposed to be the selling point contributes\n<b>essentially nothing</b>. The entire gap between the written model and NO-WRITE comes from the\n<b>content write within the same example</b> (read-only−NO-WRITE = [+16.5, −3.9, −10.8, −18.0]).</p></div>\n<div class=\"card\" style=\"margin-top:8px\"><h3 style=\"margin-top:0\">So who plays a role after training?</h3>\n<p class=\"why\">The trained <b>read projections</b> (<code>delta_q/k/v/o_proj</code> + <code>memory_q_proj</code>),\ndriven by the <b>content write of the current example</b>. The mechanism that actually runs is:</p>\n<ol class=\"why\" style=\"margin:4px 0 0\">\n<li>write this example's prompt (question + 3 peer answers) into a fresh S;</li>\n<li>read S back to produce Δq/Δk/Δv/Δo that re-encode the peers and steer the selection logits.</li>\n</ol>\n<p class=\"why\" style=\"margin-top:6px\">That is a <b>within-example re-encoding of the candidates</b> — a learned\n\"second look\" at the content — <b>not</b> an accumulation of trust across the stream. It explains every\nobservation at once: dropping <code>trS</code> does nothing (the useful write is the current example's content,\nre-created every step); resetting cross-example memory does nothing (nothing useful was carried anyway); the\nfixed write projections matter (they shape that re-encoding); and feedback adds ~0 (it is overwritten by the next\ncontent write — the 0.982<sup>~800</sup> decay shown in §9).</p></div>\n<div class=\"callout olive\" style=\"margin-top:10px\"><span class=\"tag\">why this is not yet the intended method</span>\n<p class=\"why\" style=\"margin:6px 0 0\">The design goal was: <b>(i)</b> reads steer the CM to weigh peer identity + content,\nand <b>(ii)</b> feedback adapts online to the test stream's structure for generalization. Reality: <b>(i)</b> works\nbut only as a within-example content re-read (it even <i>hurts</i> as CF stabilizes — +16.5 at CF@0 but\n−18 at CF@90, because the content cue it latched onto is the shuffled-role artifact, not reliability), and\n<b>(ii)</b> does not happen at all — the per-token decay erases the feedback state before the next selection\nreads it. For feedback to play its intended role, the trust signal must <b>survive the content write</b> (e.g.\nthe dual-state separation of Algorithm A, or a non-decaying / slot-addressed trust read like the #8 head) AND be\n<b>read at selection time</b> — neither holds in the current single-state, decay-dominated path.</p></div>",

    "html": "<h2>11. Control on a BALANCED dataset (chaotic stream)</h2>\n<div class=\"card\"><p class=\"why\">The CF result in §10 had a confound: as CF rises, correctness\n<b>concentrates on one peer</b> (at CF@90 peer&nbsp;2 is right 76% of the time vs 36/39% for the others), so a\nmemoryless model can climb just by latching onto answer quality. The <b>chaotic reliability stream</b> removes\nthis: it is <b>globally balanced</b> (per-peer correct rate 50–60%, oracle ceiling 100%), but the\n<i>best</i> peer shifts from window to window — each regime opens with a chaotic phase that re-samples a\nfresh random reliability vector per window, then settles. This is the regime online feedback is <b>designed</b>\nfor: no fixed peer wins globally, and recent reliability should predict current reliability.</p>\n<p class=\"why\" style=\"margin-top:6px\">0.6B, cold start, 1080 examples. As in §10, A and B give identical\nNO-WRITE numbers (zero steering), so the frozen-backbone row is shared. The <b>#8 trust-head</b> arm (per-peer state + learned trust bias, cold online) is now included for comparison.</p></div>",

    "html": "<div class=\"callout clay\"><span class=\"tag\">what the balanced control shows</span>\n<p class=\"why\" style=\"margin:6px 0 0\">On this balanced stream the no-write frozen backbone and the two write\nmechanisms (A, B) land within ~1.3 points (59.8–61.1) — effectively a <b>tie</b>. The\n<b>#8 trust-head is the worst of all arms at 56.0</b>, ~4.6 below the frozen backbone: the learned trust bias,\nwhich looked “safe” on CF (it tracked pure-anon there), actually <b>hurts</b> once peer roles are\nbalanced and shift window-to-window — the per-peer trust it accumulates is stale/misleading rather than\nneutral. Two robust points remain: (1) <b>accumulate equals reset</b> (B bit-identical; A 60.6 vs 59.8) —\ncarrying memory forward buys essentially nothing even on a stream built so recent feedback predicts current\nreliability; (2) no write/steer/trust variant <b>beats</b> the frozen backbone once the data is balanced.</p></div>",

    "html": "<h2>11b. Why is NO-WRITE the best? — the delta-rule is wrong for inter-agent feedback</h2>\n<div class=\"card\"><p class=\"why\">Two facts resolve the apparent paradox that \"trS=0, no feedback\" wins:</p>\n<ul class=\"why\" style=\"margin:4px 0 0\">\n<li><b>The CM already sees everything.</b> The selection prompt is <code>Question + [Context] + every Peer's full\nanswer + \"Answer:\"</code> — all three agents' complete responses are in-context. The memory <code>S</code> is\nonly an <i>extra</i> steering signal on top of a fully-informed frozen model. So NO-WRITE is not \"blind\"; it is a\ncapable Qwen3 reading all candidates. That floor is high (57.9, vs ~50 random, vs 66 best-fixed-peer).</li>\n<li><b>The delta-rule overwrites itself token-by-token.</b> The update\n<code>S ← keep·S − erase·(Sk)kᵀ + write·(v kᵀ)</code> runs <i>per token</i>\nwith keep = σ(β) ≈ 0.982. Over an ~800-token write the prior state survives by\n0.982<sup>800</sup> ≈ 10<sup>−7</sup>. So whatever feedback you wrote last example is erased by the\nnext example's content write before selection ever reads it — only the last few tokens of the most recent\nwrite actually persist.</li>\n</ul>\n<p class=\"why\" style=\"margin-top:6px\"><b>Consequence:</b> the delta-rule memory can only carry a tiny, recency-dominated\ntrace — enough to re-encode the <i>current</i> example's content (the within-example steer of §10b), but\nstructurally unable to <b>accumulate</b> a stable per-peer trust signal across a stream. That is exactly the wrong\ninductive bias for inter-agent feedback, where the useful signal (\"peer X has been reliable on this task type\") must\n<b>survive many intervening tokens/examples</b>. The user's diagnosis is correct: a token-level overwriting recurrence\nis mismatched to slowly-varying trust.</p></div>",
    "type": "html"
  },
  {
    "html": "<h2>13. Proposal — a noise-robust symmetric steering state (Weyl / S4-style)</h2>\n<div class=\"card\"><p class=\"why\"><b>The idea.</b> Replace (or augment) the delta-rule recurrence with a state whose\n<i>spectrum</i> carries the trust signal and is provably stable to small online perturbations. For a real symmetric\nmatrix $M=M^{\\top}$ with eigenvalues $\\lambda_i(M)$, Weyl's inequality gives, for any symmetric perturbation $E$,</p>\n<p style=\"text-align:center\">$$|\\lambda_i(M+E)-\\lambda_i(M)| \\le \\|E\\|_2 .$$</p>\n<p class=\"why\">So a single noisy/irrelevant online update (small $\\|E\\|_2$) moves every eigenvalue by at most its\nspectral norm — the memory's spectral \"content\" is Lipschitz-stable to noise, and only <b>repeated, aligned</b>\nsignals (large cumulative $\\|E\\|_2$ along a consistent eigvector) shift the spectrum meaningfully. That is precisely\nthe filter we want: ignore one-off noise, integrate consistent reliability evidence.</p></div>\n<div class=\"flex\" style=\"gap:16px;margin-top:8px\">\n<div class=\"card\" style=\"flex:1;border-left:4px solid #788C5D\"><h3 style=\"margin-top:0\">Why it fits the failure mode</h3>\n<p class=\"why\">The delta-rule's problem is <b>recency overwrite</b> (keep<sup>800</sup>→0). A symmetric\naccumulator with bounded, additive symmetric updates <code>M ← M + η·sym(u uᵀ)</code> does the\nopposite: it <b>integrates</b> evidence and is spectrally noise-robust (Weyl). Trust would live in stable eigen-directions,\nnot in a vector that the next 800 tokens erase.</p></div>\n<div class=\"card\" style=\"flex:1;border-left:4px solid #788C5D\"><h3 style=\"margin-top:0\">The S4 precedent</h3>\n<p class=\"why\">S4/S4D enforce a structured, stable state matrix: the diagonal $A=-\\,\\text{real}-i\\,\\text{imag}$ with\n<b>forced negative real part</b> (<code>dplr.py</code>: <code>A = -real_part - 1j*imag_part</code>), guaranteeing a\nstable, well-conditioned long-range memory instead of an exploding/forgetting recurrence. Our analogue: constrain the\nsteering state to symmetric (real eigenvalues) with a controlled spectral radius, so it is a stable integrator by\nconstruction — the same \"make the state matrix's spectrum well-behaved\" move S4 uses for long sequences.</p></div>\n</div>\n<div class=\"card\" style=\"margin-top:8px\"><h3 style=\"margin-top:0\">Concrete sketch (to pressure-test)</h3>\n<ul class=\"why\" style=\"margin:4px 0 0\">\n<li><b>State:</b> per-peer symmetric $M_p\\in\\mathbb{R}^{r\\times r}$, $M_p=M_p^{\\top}$, init 0.</li>\n<li><b>Feedback write (symmetric, additive, no decay):</b> $M_p \\leftarrow M_p + \\eta\\,y_p\\,\\tfrac{1}{2}(u_p u_p^{\\top})$,\nwhere $u_p$ is a learned embedding of the feedback event and $y_p\\in\\{+1,-1\\}$ is correct/incorrect. Additive (not\noverwriting) ⇒ integrates; symmetric ⇒ real spectrum + Weyl-stable.</li>\n<li><b>Read/steer:</b> read a scalar or low-rank trust signal from $M_p$'s spectrum (e.g. top eigenvalue, or\n$q^{\\top}M_p q$ for a learned probe $q$) and add it to that peer's selection logit — like the #8 head but on a\nstable spectral state instead of the decaying delta state.</li>\n<li><b>Stability knob:</b> optionally clip the spectral radius (project eigenvalues into $[-\\rho,\\rho]$) so no single\nexample can dominate — the explicit version of S4's forced-negative-real-part trick.</li>\n</ul>\n<p class=\"why\" style=\"margin-top:6px\"><b>Why this is promising and not just decoration:</b> it directly attacks the\nmeasured failure (content write erases trust): an additive symmetric integrator has <b>no per-token decay</b>, so the\nfeedback survives to selection; and Weyl gives a formal noise-robustness guarantee the delta-rule lacks.</p></div>\n<div class=\"callout clay\" style=\"margin-top:10px\"><span class=\"tag\">caveats to settle before building</span>\n<p class=\"why\" style=\"margin:6px 0 0\">(1) <b>Reading the spectrum is non-trivially differentiable</b> — eigendecomposition\nbackprop is unstable on near-degenerate eigenvalues; a learned quadratic probe $q^{\\top}Mq$ avoids eig() and is smooth.\n(2) <b>Symmetric writes lose directional info</b> (only the symmetric part of $u v^{\\top}$ survives) — fine for a\nscalar trust magnitude, but it cannot encode \"who beats whom\" asymmetrically; keep per-peer states to sidestep this.\n(3) The steering still has to <b>change the selection logits</b> — the #8 result shows a scalar trust bias can be\ntoo weak; the spectral read must be given enough gain. (4) None of this fixes the deeper finding that on these CF/balanced\nstreams <b>history barely helps the frozen backbone at all</b>; the win condition is a stream where stable per-peer\nreliability genuinely predicts the future, and where the spectral state is the only thing carrying it.</p></div>",
    "type": "html"
  },
  {
    "html": "<h2>14. The fix that works: event-axis symmetric trust memory</h2>\n<div class=\"card\" style=\"border-left:4px solid #788C5D\"><p class=\"why\">Acting on the diagnosis (§10b/§11b: the\ntoken-level delta-rule self-overwrites, so feedback never accumulates), we replaced the feedback channel with an\n<b>event-axis symmetric information matrix</b> per peer: $M_p\\leftarrow\\gamma M_p+\\eta\\,s_t\\,\\phi_t\\phi_t^{\\top}$,\nupdated <b>once per task</b> (not per token), with $\\phi_t$ = task-type embedding (math/code/rag),\n$\\gamma=e^{-\\mathrm{softplus}(\\theta)}$ learned, frozen backbone. The trust read becomes a <b>steering vector</b>\n$M_p\\phi_*$ injected into the CM's upper-half layers, so the accumulated per-peer reliability re-ranks the candidates.\n0.6B, CF unified, cold, online.</p></div>",
    "type": "html"
  },

    "html": "<div class=\"callout olive\"><span class=\"tag\">it works — and the sanity control proves the gain is real</span>\n<p class=\"why\" style=\"margin:6px 0 0\"><b>SYM steer = 70.1 mean</b> vs NO-WRITE 57.9 and Delta-Mem ~54 — the first\nmethod in this project where online feedback clearly helps, and (unlike the delta-mem write) it <b>rises</b> with CF\nstability. The <b>ablate sanity</b> makes it trustworthy: turning the memory off reproduces NO-WRITE to the decimal\n(51.0 / 63.2 at CF@0 / CF@90 == the frozen backbone), so the gain is not a harness artifact — it comes entirely\nfrom the accumulated trust steering, the thing the delta-rule could never carry.</p></div>\n<div class=\"card\" style=\"margin-top:8px\"><h3 style=\"margin-top:0\">Why the CF@0 gain (85.6 vs best-fixed 55.7) is legitimate</h3>\n<p class=\"why\">At CF@0 the <i>global</i> per-peer rate is balanced (55.7/46.9/48.4), which is why a scalar reputation or EMA\ncaps out near best-fixed (55.7). But reliability is strongly skewed <b>within each task type</b>: math peer&nbsp;0 = 91.5%,\ncode peer&nbsp;2 = 68.5%, rag peer&nbsp;1 = 93.2% — the balance is just these specializations averaging out. Because\n$\\phi$ = task-type, $M_p$ stores <b>per-(peer, task-type)</b> trust, whose ceiling (per-task best-fixed) is <b>88.8</b> at p0\nand 82.0 at p90. SYM steer reaching 85.6 at p0 is real progress toward that ceiling — exactly the contextual-reliability\nsignal the symmetric matrix unlocks and a scalar cannot represent. (The mid-stream dip at CF@50/70 tracks the data's own\nper-task ceiling, which is lowest there — 62.9 / 72.5 — not a failure of the method.)</p></div>\n<div class=\"callout clay\" style=\"margin-top:10px\"><span class=\"tag\">honest caveats</span>\n<p class=\"why\" style=\"margin:6px 0 0\">(1) Train and eval are the <b>same prop stream</b> (online adaptation on the eval stream\nitself — same protocol as the baselines above); a held-out generalization split would further strengthen the claim.\n(2) The CM-owned joint matrix $G$ adds ~0 here: with 3 task-separable peers there is little redundancy structure to exploit\n— $G$ should matter more with many overlapping agents. (3) Files: <code>feedback_state/symmetric_memory.py</code>,\n<code>train_symmetric_memory.py</code>, <code>eval_symmetric_memory.py</code>, <code>configs/symmetric_memory.yaml</code>.</p></div>",

    "html": "<h2>15. What should $\\phi$ be? — context-direction and decay-shape ablations</h2>\n<div class=\"card\"><p class=\"why\">$\\phi_t$ defines the <b>direction</b> along which trust accumulates, so \"persistent alignment\"\n(the thing the symmetric matrix integrates) is only meaningful if $\\phi$ is chosen well. We compared three context\nsources for $\\phi$, and two shapes for the decay $\\gamma$. All steer coupling, CF unified, 0.6B, cold, online.</p>\n<ul class=\"why\" style=\"margin:4px 0 0\">\n<li><b>$\\phi$=task</b>: a one-hot task-type embedding (math/code/rag) → 3 fixed near-orthogonal directions, zero noise.</li>\n<li><b>$\\phi$=desc</b>: the frozen CM's mean-pooled hidden of the <i>problem text</i> (continuous, semantic).</li>\n<li><b>$\\phi$=query</b>: the CM's mean-pooled hidden of the <i>full selection prompt</i> (continuous, richest).</li>\n<li><b>decay scalar vs diag</b>: one $\\gamma$ for the whole matrix, vs a per-eigen-direction $\\gamma$ vector (rank-16),\napplied as the symmetry-preserving $\\Gamma^{1/2}M\\Gamma^{1/2}$.</li>\n</ul></div>",

    "html": "<div class=\"callout clay\"><span class=\"tag\">surprising: the simple one-hot phi wins; continuous phi hurts</span>\n<p class=\"why\" style=\"margin:6px 0 0\">We expected continuous $\\phi$ (desc/query) to <i>unlock</i> the matrix's spectral\nadvantage. The opposite happened: desc/query land at 58–60, barely above NO-WRITE (57.9), while the one-hot\n<b>$\\phi$=task wins at 68.2</b>. Likely cause: the CM-hidden vectors are entangled and high-norm, the 1024→16 projection\nmust learn a useful subspace from only ~2685 events, and — critically — within a task type $\\phi$ now <b>varies\nexample-to-example</b>, so \"persistent alignment\" is <i>weakened</i>, not strengthened. The task one-hot gives 3 clean,\nstable directions, which is the strongest signal at this scale. This is a direct, if inverted, confirmation of the worry\nthat \"if $\\phi$ is chosen badly, persistent alignment is meaningless.\"</p></div>\n<div class=\"callout clay\" style=\"margin-top:10px\"><span class=\"tag\">diagonal decay ≈ scalar</span>\n<p class=\"why\" style=\"margin:6px 0 0\">A per-eigen-direction $\\gamma$ (diag $\\Gamma$) gives <b>68.6 vs 68.2</b> — a tie\n(+0.4, a small p90 gain). Different memory time-constants per direction don't help at this scale. Keep the simplest:\n<b>$\\phi$=task + scalar $\\gamma$</b>.</p></div>\n<div class=\"callout olive\" style=\"margin-top:10px\"><span class=\"tag\">honest limitation — the key missing control</span>\n<p class=\"why\" style=\"margin:6px 0 0\">Because $\\phi$=task is a one-hot, $M_p$ effectively reduces to a\n<b>per-(peer, task-type) signed decayed scalar</b> — i.e. the matrix's <i>spectral separation</i> (its advantage over a\nscalar EMA) is <b>not</b> exercised by the winning configuration. So the 68 result demonstrates that <b>event-axis\nsymmetric accumulation works</b>, but does <b>not yet</b> prove the matrix beats a plain per-(peer,task) scalar EMA. That\nEMA baseline is the next control to run; the matrix's spectral advantage would only show on a $\\phi$ with genuine\nsub-task structure (which desc/query did not provide here).</p></div>",
    "type": "html"
  },

    "html": "<h2>12. How to reproduce</h2>\n<div class=\"card\"><p class=\"why\">All three designs share data, tokenization, layers, rank and optimizer; only\nthe algorithm flag / config differs.</p>\n<div class=\"code\"><pre># Algorithm B (single state) — train then eval\nPYTHONPATH=. python train_feedback_algo.py --config configs/joint_ar_pps_algoB.yaml \\\n    --central_model &lt;model&gt; --output_dir outputs/algoB_06\nPYTHONPATH=. python eval_feedback_algo.py  --config configs/joint_ar_pps_algoB_eval.yaml \\\n    --checkpoint outputs/algoB_06 --feedback_algo b --mode online_feedback \\\n    --offline_data data/v3_unified/p90.jsonl\n\n# Algorithm A (dual state + gate): same scripts with --feedback_algo a\n# Approach #8 (anonymous + trust-head): train_joint_selector.py + configs/joint_ar_pps_trusthead.yaml</pre></div>\n<p class=\"why\" style=\"margin-top:6px\">Key config knobs that encode the fix: <code>delta_output_init: random</code>,\n<code>delta_online_gain: 0.05</code>, <code>shuffle: false</code> (the persistent state needs ordered\nsingle-stream processing), <code>max_length: 8192</code>. A built-in grad-probe prints the WRITE vs READ\nprojection gradient norms on the first step so you can confirm \"write projections TRAIN (bug fixed)\".</p></div>",
