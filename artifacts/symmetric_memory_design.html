[
  {
    "type": "html",
    "html": "<div class=\"eyebrow\">Paper Method · Sigma Only</div>\n<h1>Sigma-Mem: Symmetric Event Memory for Peer Selection</h1>\n<p class=\"lede\">This document consolidates the current Sigma method into a paper-ready form. Sigma-Mem turns peer selection into online, task-conditioned trust estimation: each peer owns a symmetric event memory that accumulates evidence over a stream, while all learned dynamics and scoring functions are shared across peers.</p>\n<div class=\"summary-band\">\n  <div><span class=\"k\">Scope</span>Sigma core only: no LoRA, no BCE baseline, no two-stage LoRA+Sigma</div>\n  <div><span class=\"k\">Selector</span>shared candidate Yes/No utility</div>\n  <div><span class=\"k\">State</span>one runtime symmetric matrix per peer</div>\n  <div><span class=\"k\">Claim</span>train with 3 peers, instantiate with variable peer counts</div>\n</div>"
  },
  {
    "type": "html",
    "html": "<div class=\"stat-grid\">\n  <div class=\"stat-card\"><div class=\"stat-num\">$M_{p,t}$</div><div class=\"stat-label\">peer-specific runtime memory</div><div class=\"stat-delta up\">state, not checkpoint parameter</div></div>\n  <div class=\"stat-card\"><div class=\"stat-num\">$\\phi_t$</div><div class=\"stat-label\">task address</div><div class=\"stat-delta up\">soft prototype over CM representations</div></div>\n  <div class=\"stat-card\"><div class=\"stat-num\">$u_{p,t}$</div><div class=\"stat-label\">candidate utility</div><div class=\"stat-delta up\">shared Yes/No score</div></div>\n  <div class=\"stat-card\"><div class=\"stat-num\">$\\Theta$</div><div class=\"stat-label\">shared learned parameters</div><div class=\"stat-delta up\">independent of peer count</div></div>\n</div>\n<div class=\"callout rec\"><div class=\"callout-h\">One-sentence method statement</div><p>Sigma-Mem learns a peer-agnostic rule for writing, reading, and using task-conditioned reliability evidence; adding a peer at test time only allocates a new memory matrix and reuses the same learned rule.</p></div>"
  },
  {
    "type": "html",
    "html": "<h2>1. Problem Setup</h2>\n<div class=\"card\">\n<p>At event $t$, an input task $x_t$ is answered by a finite set of peers $\\mathcal P_t$. Peer $p\\in\\mathcal P_t$ provides a candidate response $a_{p,t}$. A center model must select the candidate most likely to be correct:</p>\n<p>$$\\hat p_t = \\arg\\max_{p\\in\\mathcal P_t} u_{p,t}.$$</p>\n<p>Let $c_{p,t}\\in\\{0,1\\}$ denote whether peer $p$'s answer is correct, and define the signed event feedback</p>\n<p>$$s_{p,t}=2c_{p,t}-1\\in\\{-1,+1\\}.$$</p>\n<p>The central difficulty is that a single prompt may not contain enough information to infer which peer should be trusted. Peers can have persistent, task-dependent reliability patterns. Sigma-Mem makes those patterns explicit by maintaining an online memory for each peer and reading that memory when scoring future candidates.</p>\n</div>"
  },
  {
    "type": "html",
    "html": "<h2>2. Core Design Principles</h2>\n<div class=\"grid col-2\">\n  <div class=\"card\"><h3>Event-level memory</h3><p>The memory updates once per task outcome, not once per generated token. This makes the state independent of response length and prevents high-frequency token dynamics from overwriting trust evidence.</p></div>\n  <div class=\"card\"><h3>Task-conditioned trust</h3><p>Peer reliability is not represented by a global scalar. Sigma writes evidence along a task address $\\phi_t$, so reliability on one task region can transfer to related regions without forcing a single universal reputation.</p></div>\n  <div class=\"card\"><h3>Symmetric accumulation</h3><p>Each update is a signed rank-one outer product $s_{p,t}\\phi_t\\phi_t^\\top$. Repeated aligned evidence builds stable directions; isolated noisy events have bounded spectral effect.</p></div>\n  <div class=\"card\"><h3>Peer-count invariance</h3><p>The learned parameters do not contain peer-indexed tensors. Each peer has its own runtime state, but the write rule, read rule, steering map, and candidate scorer are shared.</p></div>\n</div>"
  },
  {
    "type": "html",
    "html": "<h2>3. Sigma Memory State</h2>\n<div class=\"card\">\n<p>For every peer $p$, Sigma-Mem maintains a symmetric matrix</p>\n<p>$$M_{p,t}\\in\\mathbb S^r,\\qquad \\mathbb S^r=\\{M\\in\\mathbb R^{r\\times r}:M=M^\\top\\}.$$</p>\n<p>The current implementation uses $r=16$ and initializes $M_{p,0}=0$ at the beginning of an evaluation stream. After observing feedback for event $t$, the memory is updated as</p>\n<p>$$M_{p,t+1}=\\gamma M_{p,t}+\\eta s_{p,t}\\phi_t\\phi_t^\\top.$$</p>\n<p>Here $\\phi_t\\in\\mathbb R^r$ is an L2-normalized task address, $\\eta>0$ is a learned write strength, and $\\gamma\\in(0,1]$ is a learned retention factor. The update is symmetric by construction: $M_{p,0}$ is symmetric, decay preserves symmetry, and $\\phi_t\\phi_t^\\top$ is symmetric.</p>\n</div>\n<div class=\"callout olive\"><div class=\"callout-h\">Interpretation</div><p>A positive event increases trust for peer $p$ in the task direction $\\phi_t$; a negative event subtracts trust in that same direction. The matrix therefore stores directional evidence about when a peer should or should not be trusted.</p></div>"
  },
  {
    "type": "html",
    "html": "<h2>4. Stability of the Update</h2>\n<div class=\"card\">\n<p>The learned parameters are constrained by reparameterization:</p>\n<p>$$\\eta=\\operatorname{softplus}(a),\\qquad \\gamma=\\exp(-\\operatorname{softplus}(\\theta)).$$</p>\n<p>Thus $\\eta>0$ and $0<\\gamma\\le 1$ for all unconstrained $a,\\theta$. Since $\\lVert\\phi_t\\rVert_2=1$, a single event update has spectral norm $\\lVert\\eta s_{p,t}\\phi_t\\phi_t^\\top\\rVert_2=\\eta$. If $\\gamma<1$, repeated bounded updates satisfy</p>\n<p>$$\\lVert M_{p,t}\\rVert_2\\le \\sum_{k=0}^{t-1}\\gamma^k\\eta \\le \\frac{\\eta}{1-\\gamma}.$$</p>\n<p>This is the main reason for using a matrix-valued symmetric event memory rather than a free-form recurrent hidden state: the update is expressive enough to accumulate task-conditioned evidence but remains spectrally controlled.</p>\n</div>"
  },
  {
    "type": "html",
    "html": "<h2>5. Task Addressing</h2>\n<div class=\"card\">\n<p>Sigma requires a task address $\\phi_t$ that maps semantically related tasks to nearby memory directions. The current method uses a soft-prototype address built from frozen center-model representations.</p>\n<p>Let $h_t$ be a mean-pooled hidden representation of the query from a mid-stack CM layer. Training queries are grouped by task type and summarized into fixed prototype centroids $C_1,\\ldots,C_K$, with whitening statistics $\\mu,\\sigma$ saved in the checkpoint. The whitened query $z_t=(h_t-\\mu)/(\\sigma+\\epsilon)$ is softly assigned to the centroids:</p>\n<p>$$\\alpha_t=\\operatorname{softmax}(\\cos(z_t,C)/\\tau).$$</p>\n<p>A small learned projection maps the prototype mixture into the rank-$r$ memory space:</p>\n<p>$$\\phi_t=\\frac{W_\\phi\\alpha_t}{\\lVert W_\\phi\\alpha_t\\rVert_2}.$$</p>\n<p>The centroids and whitening statistics are buffers, not learned parameters. The learned part is the projection $W_\\phi$, which decides how prototype mixtures should address the memory.</p>\n</div>"
  },
  {
    "type": "html",
    "html": "<h2>6. Memory Read and Residual Steering</h2>\n<div class=\"card\">\n<p>Before scoring peer $p$'s candidate, Sigma reads the peer's memory using the current task address:</p>\n<p>$$\\nu_{p,t}=M_{p,t}\\phi_t.$$</p>\n<p>This rank-space read is lifted into the hidden dimension of the frozen center model:</p>\n<p>$$\\delta_{p,t}=g W_{\\mathrm{up}}\\nu_{p,t},$$</p>\n<p>where $W_{\\mathrm{up}}$ and scalar gain $g$ are learned. During candidate scoring, $\\delta_{p,t}$ is added to the residual stream of the upper decoder layers. The center model backbone itself remains frozen; Sigma changes the hidden trajectory through a small, memory-derived residual intervention.</p>\n</div>\n<div class=\"callout rec\"><div class=\"callout-h\">Why steering instead of score addition?</div><p>The memory is not a hand-coded bonus such as <code>score + lambda * trust</code>. It conditions the center model's own Yes/No evaluation of the candidate, which keeps the mechanism model-facing rather than method-specific score calibration.</p></div>"
  },
  {
    "type": "html",
    "html": "<h2>7. Shared Candidate Utility</h2>\n<div class=\"card\">\n<p>The selector does not train a fixed peer-name classifier. Instead, every candidate is evaluated by the same Yes/No utility. For peer $p$, the prompt contains the task, context when available, all peer responses, and marks one response as the candidate under review. The utility is</p>\n<p>$$u_{p,t}=\\log P_{\\mathrm{CM}}(\\text{Yes}\\mid q_{p,t};\\delta_{p,t})-\\log P_{\\mathrm{CM}}(\\text{No}\\mid q_{p,t};\\delta_{p,t}).$$</p>\n<p>The same Yes and No tokens are used for every peer and for every peer count. The prediction is</p>\n<p>$$\\hat p_t=\\arg\\max_{p\\in\\mathcal P_t}u_{p,t}.$$</p>\n<p>This candidate-wise formulation is crucial for train-3/test-$k$ generalization. The model learns a reusable utility function rather than a classifier whose output vocabulary is tied to exactly three named peer slots.</p>\n</div>"
  },
  {
    "type": "html",
    "html": "<h2>8. Training Objective</h2>\n<div class=\"card\">\n<p>Training examples provide per-peer correctness labels. A deterministic target rule selects one correct peer $p_t^*$ as the gold candidate. Sigma computes utilities for all peers present in the training example and optimizes cross-entropy over those utilities:</p>\n<p>$$\\mathcal L_t=-\\log\\frac{\\exp u_{p_t^*,t}}{\\sum_{p\\in\\mathcal P_t}\\exp u_{p,t}}.$$</p>\n<p>The frozen CM backbone is not updated. The trainable Sigma parameters are $W_\\phi$, $\\eta$, $\\gamma$, $W_{\\mathrm{up}}$, and $g$. In the current configuration, all of these are shared across peers.</p>\n<p>To make the write dynamics learnable without backpropagating through the entire stream, training reads through one differentiable local write applied to a detached historical state:</p>\n<p>$$\\widetilde M_{p,t+1}=\\gamma M_{p,t}^{\\mathrm{stopgrad}}+\\eta s_{p,t}\\phi_t\\phi_t^\\top,\\qquad \\widetilde\\nu_{p,t}=\\widetilde M_{p,t+1}\\phi_t.$$</p>\n<p>The persistent runtime memory is then advanced under no gradient after the optimization step. This exposes $\\eta$, $\\gamma$, and $W_\\phi$ to the loss while keeping the online state an efficient stream buffer.</p>\n</div>"
  },
  {
    "type": "html",
    "html": "<h2>9. Online Inference</h2>\n<div class=\"timeline\">\n  <div class=\"tl-entry\"><div class=\"tl-time\">1 · Address</div><div class=\"tl-body\">Encode the current task with the frozen CM and compute $\\phi_t$ using the soft-prototype address.</div></div>\n  <div class=\"tl-entry\"><div class=\"tl-time\">2 · Read</div><div class=\"tl-body\">For each peer $p$, compute $\\nu_{p,t}=M_{p,t}\\phi_t$ and steering vector $\\delta_{p,t}=gW_{\\mathrm{up}}\\nu_{p,t}$.</div></div>\n  <div class=\"tl-entry\"><div class=\"tl-time\">3 · Score</div><div class=\"tl-body\">Evaluate each candidate with the shared Yes/No utility under its corresponding memory steering.</div></div>\n  <div class=\"tl-entry\"><div class=\"tl-time\">4 · Select</div><div class=\"tl-body\">Choose the peer with the largest utility.</div></div>\n  <div class=\"tl-entry\"><div class=\"tl-time\">5 · Write</div><div class=\"tl-body\">After feedback is available, update every peer memory once with $M_{p,t+1}=\\gamma M_{p,t}+\\eta s_{p,t}\\phi_t\\phi_t^\\top$.</div></div>\n</div>\n<div class=\"callout olive\"><div class=\"callout-h\">Statefulness</div><p>Sigma is a stream method. The order of evaluation examples matters because earlier feedback changes later decisions. Reported results therefore correspond to the specified evaluation stream, not to independent shuffled batches.</p></div>"
  },
  {
    "type": "html",
    "html": "<h2>10. Peer-Count Generalization</h2>\n<div class=\"card\">\n<p>Sigma separates peer-specific state from shared learned parameters:</p>\n<p>$$\\underbrace{\\{M_{p,t}\\}_{p\\in\\mathcal P_t}}_{\\text{runtime state; grows with peer count}}\\qquad\\text{vs.}\\qquad\\underbrace{\\Theta=\\{W_\\phi,\\eta,\\gamma,W_{\\mathrm{up}},g,F_{\\mathrm{Yes/No}}\\}}_{\\text{shared parameters; independent of peer count}}.$$</p>\n<p>When evaluating with a new number of peers, the checkpointed learned parameters are reused unchanged. The evaluator only allocates a runtime memory matrix for each peer:</p>\n<p>$$M_{p,0}=0,\\qquad p=1,\\ldots,P_{\\mathrm{test}}.$$</p>\n<p>New peers do not require new trained parameters. They begin with zero evidence and adapt through the same event update. This gives the method a clean train-3/test-$k$ story: the trained object is not a three-way selector, but a shared candidate utility scorer equipped with one symmetric evidence state per peer.</p>\n</div>"
  },
  {
    "type": "html",
    "html": "<h2>11. What Belongs to Sigma, and What Does Not</h2>\n<div class=\"procon\">\n  <div class=\"pros\"><ul>\n    <li>Core Sigma: symmetric per-peer matrices $M_{p,t}$.</li>\n    <li>Core Sigma: soft-prototype task address $\\phi_t$.</li>\n    <li>Core Sigma: residual steering through a frozen center model.</li>\n    <li>Core Sigma: shared candidate Yes/No utility.</li>\n    <li>Core Sigma: peer-count-invariant runtime state allocation.</li>\n  </ul></div>\n  <div class=\"cons\"><ul>\n    <li>LoRA baselines are not part of this method section.</li>\n    <li>BCE/AR control heads are not part of Sigma's definition.</li>\n    <li>Uncertainty gating is an inference policy or ablation, not the core memory mechanism.</li>\n    <li>The optional joint matrix $G$ is disabled in the current main configuration and should not be emphasized as the main method.</li>\n  </ul></div>\n</div>"
  },
  {
    "type": "html",
    "html": "<h2>12. Reviewer-Facing Claims</h2>\n<div class=\"grid col-2\">\n  <div class=\"card\"><h3>Claim 1 · Memory is structured</h3><p>The state is not an unconstrained hidden vector. It is a symmetric matrix updated by signed rank-one events, which gives a clear interpretation and stability argument.</p></div>\n  <div class=\"card\"><h3>Claim 2 · Trust is task-conditioned</h3><p>The same peer can be trusted in one task region and distrusted in another because memory is addressed by $\\phi_t$, not by a scalar global reputation.</p></div>\n  <div class=\"card\"><h3>Claim 3 · Scoring is peer-count reusable</h3><p>Candidate-wise Yes/No scoring avoids a fixed peer-name output head, so the scoring rule can be applied to any finite peer set.</p></div>\n  <div class=\"card\"><h3>Claim 4 · New peers need only state</h3><p>Additional peers instantiate new $M_p$ matrices but do not add learned parameters. This is the clean theoretical basis for train-3/test-4/5/6 experiments.</p></div>\n</div>"
  },
  {
    "type": "html",
    "html": "<h2>13. Paper-Ready Method Text</h2>\n<div class=\"card\">\n<p><b>Sigma-Mem.</b> We propose Sigma-Mem, an online memory mechanism for selecting among multiple peer responses. For each peer $p$, Sigma-Mem maintains a symmetric event memory $M_{p,t}\\in\\mathbb R^{r\\times r}$. Given a task $x_t$, a frozen center model representation is mapped to a normalized task address $\\phi_t$. The memory is read as $M_{p,t}\\phi_t$ and projected into a residual steering vector that conditions the center model while it evaluates peer $p$'s candidate response. Candidate quality is measured by a shared Yes/No utility, $\\log P(\\mathrm{Yes})-\\log P(\\mathrm{No})$, so all peers are scored by the same function rather than by a fixed peer-name classifier.</p>\n<p>After feedback is available, Sigma-Mem updates each peer memory by a signed symmetric rank-one event, $M_{p,t+1}=\\gamma M_{p,t}+\\eta s_{p,t}\\phi_t\\phi_t^\\top$. Positive events add evidence in the current task direction, while negative events subtract it. Because $\\phi_t\\phi_t^\\top$ is symmetric and $\\lVert\\phi_t\\rVert_2=1$, the update preserves symmetry and has bounded spectral effect. The learned parameters controlling addressing, retention, write strength, and steering are shared across peers; peer identity only appears through the runtime state $M_{p,t}$. Consequently, a Sigma-Mem checkpoint trained with three peers can be instantiated with more peers at test time by allocating additional memory matrices without introducing new trained parameters.</p>\n</div>"
  },
  {
    "type": "html",
    "html": "<h2>14. Main Algorithm</h2>\n<div class=\"file-diff\"><div class=\"fd-head\"><span class=\"fd-path\">Sigma-Mem online selection</span><span class=\"fd-stat\"><span class=\"a\">paper pseudocode</span></span></div><pre class=\"diff\"><span class=\"dl ctx\">Initialize M_p = 0 for every peer p in the current peer set.</span>\n<span class=\"dl ctx\">For each event t:</span>\n<span class=\"dl ctx\">  Compute task address phi_t from the frozen center model representation of x_t.</span>\n<span class=\"dl ctx\">  For each peer p:</span>\n<span class=\"dl ctx\">    Read nu_p = M_p phi_t.</span>\n<span class=\"dl ctx\">    Convert nu_p to residual steering delta_p.</span>\n<span class=\"dl ctx\">    Score candidate a_p with shared Yes/No utility under delta_p.</span>\n<span class=\"dl ctx\">  Select the peer with maximal utility.</span>\n<span class=\"dl ctx\">  When feedback is observed:</span>\n<span class=\"dl ctx\">    For each peer p, update M_p = gamma M_p + eta s_p phi_t phi_t^T.</span></pre></div>"
  },

  {
    "type": "html",
    "html": "<h2>16. Experimental Story to Support the Method</h2>\n<div class=\"card\">\n<p>The method section above naturally motivates three experiment groups:</p>\n<ul>\n  <li><b>Core CF robustness:</b> compare center-only versus Sigma across p0/p50/p70/p90 streams.</li>\n  <li><b>Peer-count generalization:</b> train with three peers and evaluate with additional unseen peers by allocating new runtime states.</li>\n  <li><b>Ablations:</b> remove memory steering, replace task-conditioned matrix memory with scalar memory, remove candidate-wise Yes/No scoring, or use peer-specific decay to test the peer-count-invariance claim.</li>\n</ul>\n<p>LoRA combinations and uncertainty gating should be introduced later as controls or extensions, not in the first presentation of Sigma itself.</p>\n</div>"
