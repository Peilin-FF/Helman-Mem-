  "html": "<h1 style=\"font-family:Georgia,serif\">Trust-Memory Selector — Results across Counterfactual Ratios</h1><p>A frozen center model (CM) scores each peer's answer; a per-peer symmetric trust memory (learned per-peer decay $\\gamma_p$ + write strength $\\eta$) steers that scoring from accumulated feedback. <b>prompt-only</b> = CM scores from the prompt alone (no trust steering); <b>ours</b> = scoring steered by the learned trust memory.</p><div class=\"callout\" style=\"border-left:4px solid #D97757;padding:10px 14px;background:#fff\"><b>Three center models compared:</b> <code>Qwen3-4B-Instruct-2507</code>, <code>Qwen3-4B-Thinking-2507</code> (same size, reasoning-tuned), <code>Qwen3-8B-Thinking</code>. <b>CF ratio p0&ndash;p90</b> = fraction of records where the strong&harr;weak peer answers are swapped; p0 = clean, p90 = 90% adversarial (trusting peer <i>identity</i> is misleading, only reading <i>content</i> survives). Accuracy = how often the selected peer is actually correct.</p></div>"

  "type": "html",
  "html": "<h2 style=\"font-family:Georgia,serif\">Why 8B-Thinking's prompt-only is so low — a slot/identity bias</h2><p>prompt-only is the 8B used <b>directly, untrained</b> (trust memory off; the frozen CM just scores each candidate). Its low scores are not a training problem — they come from <i>how this 8B checkpoint scores candidates</i>. Per-example selection logging on RAG (p0, prompt-only) makes the cause explicit. On RAG the strong peer is <b>peer_1 (phi)</b>, whose hit-rate when chosen is ~90% for every model. The question is simply: does the bare CM pick it?</p>"

  "html": "<div class=\"callout\" style=\"border-left:4px solid #D97757;padding:10px 14px;background:#fff\"><b>The bias, isolated.</b> Restrict to the <b>1002 RAG questions where peer_1 was actually correct</b> (picking it would score): the 8B chose peer_0 <b>634</b> times and peer_1 only <b>105</b>; the 4B-Thinking chose peer_0 357 and peer_1 <b>387</b>. So even when the right answer sits in slot&nbsp;1, the 8B keeps defaulting to <b>slot&nbsp;0</b> regardless of content — a position/identity bias (a known failure mode of LLM-as-scorer) that this particular 8B checkpoint exhibits strongly. It is not caused by \"thinking\" — 4B-Thinking is also a thinking model and does <i>not</i> have it (its prompt-only is the strongest of the three).</p></div>"

 {
  "type": "html",
  "html": "<div class=\"callout\" style=\"border-left:4px solid #788C5D;padding:10px 14px;background:#fff\"><b>Why this is exactly what the trust memory fixes.</b> The bias is a fixed prior toward slot&nbsp;0, independent of feedback. The trust memory learns from outcomes that peer_1 is the reliable one on RAG, and steers the CM's activations to override the slot prior — which is why the 8B's <i>ours</i> RAG jumps from 32.6 (prompt-only) to <b>91.7</b>. prompt-only exposes the backbone's raw bias; ours measures whether accumulated trust can correct it. They are different quantities, which is why the 8B can sit last on prompt-only yet be competitive on ours.</div>"
 },

  "type": "html",
  "html": "<h2 style=\"font-family:Georgia,serif\">Conclusions</h2><ul><li><b>ours &gt; prompt-only on every task</b> at the clean and high-adversarial ends, for all three center models — the trust memory works regardless of backbone.</li><li><b>Best overall: Qwen3-4B-Thinking</b> — top math (91.4), code tied with 8B (66.8 vs 67.0), strong rag (88.4), at half the 8B's size.</li><li><b>Code needs reasoning, not scale.</b> Earlier we attributed the code gain to the 8B's size; the 4B-Thinking result corrects this — a reasoning-tuned 4B reads code just as well. 4B-Instruct (no reasoning tuning) stays stuck at ~38%.</li><li><b>The 8B-Thinking checkpoint scores oddly low at prompt-only</b> (unified 44, rag 33) relative to both 4B models — an artifact of that specific checkpoint, not of \"thinking\" (4B-Thinking's prompt-only is the <i>strongest</i> of the three). Its <i>ours</i> numbers are still competitive because the trust memory compensates.</li><li><b>No data leakage</b> — train (GSM8K/APPS/SQuAD) and test sets are disjoint by dataset, id, and content hash; eval reads trust read-only before any label-driven state update.</li></ul>"
