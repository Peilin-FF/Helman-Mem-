    "html": "<div class=\"eyebrow\">OOD experiment · feedback sparsity</div><h1>稀疏反馈下的 $\\Sigma$-Mem、M-route 与 M-vote</h1><p class=\"lede\">在不重新训练的前提下，将测试流中可用于写入历史记忆的 correctness feedback 从 5% 提高到 100%，评测 Qwen3.5-4B 与 Qwen3.5-9B。这里 PIQA 保留在 replay、feedback update 和论文 OOD 统计中；文件名里的 <code>no_piqa</code> 是旧命名。</p><div class=\"stat-grid\"><div class=\"stat-card\"><div class=\"stat-num\">23,460</div><div class=\"stat-label\">FULL OOD REPLAY EVENTS</div></div><div class=\"stat-card\"><div class=\"stat-num\">17,403</div><div class=\"stat-label\">REPORTED OOD EVENTS</div></div><div class=\"stat-card\"><div class=\"stat-num\">34/34</div><div class=\"stat-label\">SIGMA SCORE STREAMS COMPLETE</div></div><div class=\"stat-card\"><div class=\"stat-num\">3</div><div class=\"stat-label\">RANDOM SEEDS</div></div></div>"
