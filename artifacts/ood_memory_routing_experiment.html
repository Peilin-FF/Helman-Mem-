    "html": "<div class=\"eyebrow\">Appendix section draft</div><h2>Direct Readout from M and G</h2><div class=\"callout rec\"><div class=\"callout-h\">目的</div><p>本节检验 Σ-Mem 的在线状态是否已经包含足够的 peer-reliability 信息，使其在不重新训练、也不调用 center model 判断当前 responses 的情况下，直接完成 OOD peer routing 与 answer aggregation。该实验把 memory 的表示能力与原方法的 residual steering / content judgment 分开测试。</p></div><div class=\"card\"><h3>Paper-ready introduction</h3><p>We further examine whether the memory states can be used directly for training-free OOD decision making, without residual steering or center-model evaluation of the current peer responses. For an input x, we first obtain its normalized competence direction φ(x) and read the task-conditioned reliability of peer p through the Rayleigh score <code>s[p] = φ(x)ᵀ M[p] φ(x)</code>. These scores can be used either for answer-free hard routing by selecting the peer with the largest s[p], or for reliability-weighted answer aggregation by summing s[p] over peers that produce the same canonical answer. To account for correlated peer behavior, we additionally use the topology state G to compute GLS-adjusted weights <code>w = (G + λI)⁻¹s</code> and aggregate answers with w. All decisions are made before the current correctness labels are revealed; M and G are updated only afterward using external feedback.</p></div><div class=\"callout\"><div class=\"callout-h\">接口边界</div><p>Hard routing 的输入只有 φ(x)、历史 M 和 event index，不接收 peer answers。Weighted aggregation 必须读取 answers 以形成 canonical answer groups，但 reliability weights s 或 w 的计算仍不读取 answer content。</p></div>"
