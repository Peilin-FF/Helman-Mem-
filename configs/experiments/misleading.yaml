# Robustness: the six peers answer with misleading but relevant solutions (docs/experiments/misleading.md).
# Every peer answers every event misleadingly once (peers -> the <stream>_misleading datasets); each misleading dataset's
# regime then chooses which of those answers enter its stream (streams). A new regime is a new file in configs/datasets/.
base: ../base.yaml
name: misleading
steps: [peers, streams, features, record, evaluate, table]
central: [q3_4b]
datasets: [misleading_rates]                 # registered in configs/datasets/: 0-100% misleading, indist6 and ood6
record: {fit: self}                          # addresses fit on each misleading stream itself (label-free)
eval_conditions: [tilt, peers, solo, swap]

table:
  rows: regimes
  reference: [q3_4b]                         # the honest rows (main experiment)
  deltas: [[tilt, peers], [tilt, solo], [peers, solo]]
  misleading_probe: true

smoke: {datasets: [indist6_misleading_p050]}
