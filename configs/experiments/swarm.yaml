# The agent swarm (docs/experiments/swarm.md): MultiAgentBench's database diagnosis with Qwen3-4B as the planner and every agent.
# The swarm step runs the benchmark as-is (star coordination) on every task and, after its loop, has each agent report its
# finding on the cause it investigated; the central model also investigates alone. The findings are the stream's answers, so the
# usual steps follow: the model's own answer joins them, features, record, peers + memory and question + peers, combination.
base: ../base.yaml
name: swarm
steps: [swarm, own, features, record, evaluate, combination, table]
central: [q3_4b]
datasets: [marble_db]
own_answer: true
record: {fit: self}
eval_conditions: [tilt, peers]                  # the central model reading the five findings, with and without the tilt
conditions:
  swarm:    {mode: swarm, label: MARBLE swarm, note: "the benchmark as-is: the planner's final decision after its star iterations"}
  verdicts: {mode: swarm, label: agents' verdicts, note: "the causes whose agents said YES, in agent order"}
swarm:
  tasks: datasets/marble_db/tasks.jsonl
  # served_name: the model's directory name unless set; vLLM's OpenAI server is started by the job on its GPU (tool calling on, thinking off)
  port: 8123                                     # +k per shard
  pg_port: 5432                                  # PostgreSQL in user space (conda env pg), +k per shard; created under pg_data/<port>
  pg_data: /mnt/data/peilin/pg
  iterations: 5                                  # the benchmark's max_iterations; also the central model's tool calls when alone
  anomaly_duration: 60                           # seconds per anomaly workload (the benchmark's default)
  shards: 2                                      # tasks split over this many GPUs, each with its own server and cluster
  gpu_memory_utilization: 0.6
  max_model_len: 16384
combination: {peers_memory: tilt, prior: [0.5, 0.0], lam: 1.0}

table:
  rows: models
  columns: [solo, swarm, verdicts, peers, tilt, combination]

smoke: {events: 4, dim: 8}                       # four tasks end to end, under outputs/smoke/
