# Other central-model families, each with its own record (the model is its own frozen judge), against the Qwen3-4B rows.
base: ../base.yaml
name: families
steps: [features, record, evaluate, table]
central: [llama31, ministral, qwen25, phi4]
datasets: [ood6, indist6]
eval_conditions: [tilt, peers, solo]
evaluation: {gpu_memory_utilization: 0.85}   # 0.35 for an 8B model on a shared GPU, 0.5 for phi-4
table:
  rows: models
  reference: [q3_4b]                         # rows read from the main experiment's results
  deltas: [[tilt, peers], [peers, solo]]
