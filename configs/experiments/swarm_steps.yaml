# The agent swarm with a pool of peers on every sub-step (docs/experiments/swarm.md): the benchmark's planner splits a task into
# five sub-steps (is X a root cause?); its agent gathers the evidence for each (a finished swarm run); the six peers of the QA
# streams each answer every sub-step from that evidence; the injected anomaly verifies every answer; the record tracks every peer;
# Qwen3-4B consults the pool with the tilt or answers alone (combination); a task's diagnosis is the causes it answers yes to.
base: ../base.yaml
name: swarm_steps
steps: [swarm, peers, streams, own, features, record, evaluate, combination, diagnose, table]
central: [q3_4b]
datasets: [marble_db_steps, marble_db_steps_qwen3_8b]      # the evidence gathered by Qwen3-4B's agents, and by Qwen3-8B's
own_answer: true
record: {fit: self}
eval_conditions: [tilt, peers]
generation: {shards: 1}                                    # 500 questions per peer: one job each
combination: {peers_memory: tilt, prior: [0.5, 0.0], lam: 1.0}

table:
  rows: models
  columns: [solo, peers, tilt, combination]

smoke: {events: 4, dim: 8}                                 # four tasks (twenty sub-steps) end to end, under outputs/smoke/
