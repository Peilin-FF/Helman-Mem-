# The agent environment with every model a whole-problem solver (docs/experiments/swarm.md): the original method, unchanged, on
# MultiAgentBench's database diagnosis. For every task the anomaly is injected once; the six peers of the QA streams and Qwen3-4B
# each investigate that live database alone (the benchmark's tool, five queries) and give a full diagnosis. The benchmark's rule
# verifies every diagnosis, the record tracks every peer, and Qwen3-4B consults the six diagnoses with the tilt or keeps its own.
base: ../base.yaml
name: swarm_solvers
steps: [swarm, own, features, record, evaluate, combination, table]
central: [q3_4b]
datasets: [marble_db_solvers]
own_answer: true
record: {fit: self}
eval_conditions: [tilt, peers]
swarm:
  tasks: datasets/marble_db/tasks.jsonl
  force_tool: query_db                           # an action is one SQL statement in a code block, parsed in our wrapper: every model can query
  workers: 6                                     # task loops sharing the seven servers, each with its own PostgreSQL cluster
  port: 8190                                     # +i per served model
  pg_port: 5480                                  # +k per worker; clusters under pg_data/<port>
  pg_data: /mnt/data/peilin/pg
  iterations: 5                                  # queries per solver
  anomaly_duration: 60
  gpu_memory_utilization: 0.6
  max_model_len: 16384
combination: {peers_memory: tilt, prior: [0.5, 0.0], lam: 1.0}

table:
  rows: models
  columns: [solo, peers, tilt, combination]

smoke: {events: 4, dim: 8}                       # four tasks end to end, under outputs/smoke/
