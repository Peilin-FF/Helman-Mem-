# Combination: per event the central model's final answer is peers + memory or question alone (docs/experiments/combination.md).
# Every model answers first: the six peers and the central model alone (its question-alone answer), and one record
# estimates the seven answers alike. Peers + memory reads the six peers with the tilt from that record; the central
# model's reading line (rho, delta), fit along the stream read before write, then chooses per event which of the two
# answers is final. The misleading rates show whether that keeps accuracy up as the peers turn misleading.
base: ../base.yaml
name: combination
steps: [own, features, record, evaluate, combination, table]
central: [q3_4b]
datasets: [misleading_rates]                 # 0-100% misleading, indist6 and ood6 (configs/datasets/)
own_answer: true                             # the central model's question-alone answer joins every stream as its last answer
record: {fit: self}                          # addresses fit on each stream itself (label-free)
eval_conditions: [tilt, solo]                # peers + memory; question alone
combination: {peers_memory: tilt, prior: [0.5, 0.0], lam: 1.0}   # the condition that competes with question alone; (rho, delta) before any event

table:
  rows: regimes
  extra_columns: [combination]

smoke: {datasets: [indist6_misleading_p050], use_released_data: true}
