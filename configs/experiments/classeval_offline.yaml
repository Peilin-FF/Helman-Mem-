# The teacher-forced ablation of the ClassEval swarm (classeval.yaml; docs/experiments/classeval.md). Every method sees the gold
# methods before it instead of what the central model committed, so the peers' answers can be generated once and every
# condition read from the same stream (the pipeline's offline steps). The record is still read before and written after every
# method along the stream; what is not live is the class: nothing the central model writes reaches a later method.
base: ../base.yaml
name: classeval_offline
steps: [questions, peers, streams, own, features, record, evaluate, combination, diagnose, table]
central: [q3_4b]
datasets: [classeval6]
own_answer: true
record:
  fit: self
  dim: 64                          # 410 events x 7 answers: a 256-dim address per part would leave most directions at the prior
  order: fixed                     # the stream's own order: classes shuffled at build time, each class's methods in order
eval_conditions: [tilt, peers]
generation: {shards: 1, max_model_len: 16384}   # 410 methods per peer: one job each; room for three turns of revision
features: {max_length: 12288}
evaluation: {max_new_tokens: 1024}
combination: {peers_memory: tilt, prior: [0.5, 0.0], lam: 1.0}

table:
  rows: models
  columns: [solo, peers, tilt, combination]

smoke: {events: 12, dim: 8}        # the first twelve methods end to end, under outputs/smoke/
