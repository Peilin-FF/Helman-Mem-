# GRPO of Qwen3-4B under combination (docs/experiments/train_combination.md). Per training question, before its rollouts,
# combination chooses the prompt from the record and the reading line kept online along the training order: peers + memory
# (the samples are readings, the tilt from the online record) or question alone (the samples are the model's own answers).
# All 8 samples of a question are of that kind. One epoch, from the frozen model.
base: ../base.yaml
name: train_combination
steps: [own, features, record, train]
central: [q3_4b]                    # the frozen judge, and the model whose own answers join the training stream
judge: q3_4b
init: q3_4b                         # the model trained
datasets: [train6]                  # the training stream: own answers, features and record of its seven answers
own_answer: true
record: {fit: self, order: shuffled0, save_addresses: true}
eval_conditions: [solo]             # the own step's question-alone run on the training stream

train_data: {dataset: train6, order: shuffled0}
val_data: {dataset: train6, order: shuffled0, limit: 64}   # validation is off during training (the evaluation follows); verl needs a file

gpus_per_run: 8
arms:
  comb3b: {prompt: combination, tilt: true}
combination: {prior: [0.5, 0.0], lam: 1.0}
tilt_overrides: [data.attn_gamma=3.0, actor_rollout_ref.model.attn_bias=True, actor_rollout_ref.rollout.attn_bias=True,
                 actor_rollout_ref.model.use_remove_padding=False, actor_rollout_ref.model.attn_implementation=sdpa]
overrides: [data.shuffle=False, trainer.val_before_train=False, trainer.test_freq=-1]   # the record's order; one epoch (grpo.yaml)

smoke:                              # --smoke: 48 questions, 2 GPUs, 2 steps
  events: 48
  gpus_per_run: 2
  overrides: [trainer.total_training_steps=2, trainer.save_freq=2, data.train_batch_size=16, actor_rollout_ref.actor.ppo_mini_batch_size=8]
  datasets: [train6]
  arms: [comb3b]
