# Event-axis symmetric trust-memory selector (replaces token-level Delta-Mem feedback).
# Frozen CM scores candidates; trust enters via a per-peer symmetric matrix M_p updated
# once per task. See artifacts/symmetric_memory_design.html.
central_model: Qwen/Qwen3-0.6B        # overridden per arm (4B/8B)
num_peers: 3
peer_models:
  - google/gemma-3-4b-it
  - microsoft/Phi-4-mini-instruct
  - Qwen/Qwen2.5-Coder-7B-Instruct

# Symmetric memory.
rank: 16                               # M_p is rank x rank
task_types: [math, code, rag]          # tasks whose CM mean-pool forms the FIXED proto centroids
# phi_mode: the trust context direction phi is the soft-prototype address (the only mode).
#   phi = normalize(W_proj @ softmax(cos(whiten(h_q), C) / tau)), C = FIXED per-task CM centroids.
#   A seen task resolves to ~its own centroid; an unseen/related task lands as a soft mixture
#   over known centroids, so accumulated trust transfers in (the generalization win). Only the
#   small map W_proj is learned; centroids are frozen, so the address can't drift into a label.
#   (The rejected extremes -- task one-hot: collides but closed; raw vec: open but ~NO-WRITE --
#   were measured and dropped. See artifacts/symmetric_memory_design.html.)
phi_mode: proto
proto_tau: 0.1                         # softmax temperature over centroid cosines
phi_layer_frac: 0.5                    # which CM layer to mean-pool for the proto centroids/query
eta_init: 0.3                          # write strength (softplus-parametrized, learned)
gamma_init: 0.9                        # decay e^-softplus(theta) (learned); ||M|| <= eta/(1-gamma)
use_joint: off                         # CM-owned agent-agent matrix G (ablation: on/off)

# Sign source for the event update M_p <- gamma M_p + eta * s * phi phi^T:
# s = +/-1 from ground-truth correctness_by_peer. (A trainable judge head was tried and
# dropped — answer correctness is not linearly readable from the frozen-CM feature,
# probe AUC ~0.69, so a learned s was not usable.)

# Selection / data.
identity_mode: anon                    # selection prompt is anonymous; identity only addresses M_p
peer_mode: one                         # one = score each peer ALONE (endorsement); joint = all peers
                                       # in one prompt. one wins (+3.8 mean, immune to cross-answer
                                       # contamination); now the default for train and eval.
include_context: true
max_length: 8192
offline_data: data/v3_unified/p90.jsonl   # CF unified mixed stream (overridden per prop)

# Optimization (only the memory params train; backbone frozen).
learning_rate: 0.001
weight_decay: 0.0
gradient_accumulation_steps: 4
warmup_ratio: 0.03
max_grad_norm: 1.0
logging_steps: 50

# Runtime.
freeze_backbone: true
dtype: bfloat16
device: cuda:0
local_files_only: true
