# Candidate-wise LoRA selector: train the center model to answer Yes/No for a
# highlighted candidate response. This is the LoRA counterpart of
# score_mode=candidate_yesno.
central_model: /mnt/data/peilin/HF_MODEL/Qwen3-0.6B
num_peers: 3
peer_models:
  - google/gemma-3-4b-it
  - microsoft/Phi-4-mini-instruct
  - Qwen/Qwen2.5-Coder-7B-Instruct

identity_mode: anon
train_order: random
test_order: orig
include_context: true
max_length: 8192
offline_data: data/mixed_train_labeled.jsonl

freeze_backbone: true
gradient_accumulation_steps: 4
learning_rate: 0.0001
weight_decay: 0.0
warmup_ratio: 0.03
max_grad_norm: 1.0
logging_steps: 100

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: [q_proj, v_proj]
gradient_checkpointing: true

dtype: bfloat16
device: cuda:0
local_files_only: true
