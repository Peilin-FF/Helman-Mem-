# LoRA selector baselines for peer selection, aligned with symmetric-memory prompt identity:
# anonymous READ prompt, no persistent state, train max_length=4096.
#
# Variants:
#   ar_shared_state_selector        -> LoRA-AR: LM CE on " Peer j"
#   joint_bce_shared_state_selector -> LoRA-BCE: per-peer correctness BCE head
model_variant: ar_shared_state_selector
use_shared_state: false
use_lora: true

central_model: /mnt/data/peilin/HF_MODEL/Qwen3-0.6B
num_peers: 3
peer_models:
  - google/gemma-3-4b-it
  - microsoft/Phi-4-mini-instruct
  - Qwen/Qwen2.5-Coder-7B-Instruct

identity_mode: anon
train_order: random
include_context: true
multi_correct_target_mode: canonical
max_length: 4096

offline_data: data/mixed_train_labeled.jsonl

freeze_backbone: true
per_device_train_batch_size: 1
shuffle: false
gradient_accumulation_steps: 4
learning_rate: 0.0001
num_train_epochs: 1
warmup_ratio: 0.03
max_grad_norm: 1.0
save_trained_state: false

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: [q_proj, v_proj]
gradient_checkpointing: true

dtype: bfloat16
device: cuda:0
local_files_only: true
logging_steps: 10

